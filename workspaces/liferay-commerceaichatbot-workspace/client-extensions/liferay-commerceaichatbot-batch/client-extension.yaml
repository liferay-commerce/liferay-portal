assemble:
    -   from: batch
        into: batch
liferay-commerceaicchatbot-batch:
    name: Liferay Commerce AI Chatbot Batch
    oAuthApplicationHeadlessServer: liferay-commerceaichatbot-batch-oahs
    type: batch
liferay-commerceaicchatbot-batch-oahs:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Liferay Commerce AI Chatbot OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Admin.List.Type.everything
        -   Liferay.Headless.Batch.Engine.everything
        -   Liferay.Object.Admin.REST.everything
    type: oAuthApplicationHeadlessServer