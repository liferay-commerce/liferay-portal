components:
    schemas:
        DSDocument:
            properties:
                assignTabsToDSRecipientId:
                    type: string
                data:
                    type: string
                fileEntryExternalReferenceCode:
                    type: string
                fileExtension:
                    type: string
                id:
                    type: string
                name:
                    type: string
                transformPDFFields:
                    type: boolean
                uri:
                    type: string
        DSEnvelope:
            properties:
                dateCreated:
                    format: date
                    readOnly: true
                    type: string
                dateModified:
                    format: date
                    readOnly: true
                    type: string
                dsDocument:
                    items:
                        $ref: "#/components/schemas/DSDocument"
                        type: array
                dsRecipient:
                    items:
                        $ref: "#/components/schemas/DSRecipient"
                        type: array
                emailBlurb:
                    type: string
                emailSubject:
                    type: string
                id:
                    type: string
                name:
                    type: string
                senderEmailAddress:
                    type: string
                siteId:
                    format: int64
                    type: integer
                status:
                    type: string
            type: object
        DSEnvelopeSignatureURL:
            properties:
                url:
                    type: string
        DSRecipient:
            properties:
                dsClientUserId:
                    type: string
                emailAddress:
                    type: string
                id:
                    type: string
                name:
                    type: string
                status:
                    type: string
                tabs:
                    type: object
        DSRecipientViewDefinition:
            properties:
                authenticationMethod:
                    type: string
                dsClientUserId:
                    type: string
                emailAddress:
                    type: string
                returnURL:
                    type: string
                userName:
                    type: string
        SignatureRequest:
            description:
                A request for one or more documents to be signed.
            properties:
                actions:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    description:
                        Actions the current user can take on the request, such as signing it when it is their turn. Read-only.
                    readOnly: true
                    type: object
                creator:
                    $ref: ../../headless/headless-delivery/headless-delivery-impl/rest-openapi.yaml#Creator
                    description:
                        The user who created the request. Read-only.
                    readOnly: true
                dateCreated:
                    description:
                        When the request was created. Read-only.
                    format: date-time
                    readOnly: true
                    type: string
                documentTitles:
                    description:
                        Titles of the documents to be signed, separated by commas. Read-only.
                    readOnly: true
                    type: string
                emailBody:
                    description:
                        Body of the notification sent to each signer.
                    type: string
                emailSubject:
                    description:
                        Subject of the notification sent to each signer.
                    type: string
                expirationDate:
                    description:
                        When the provider voids the request if it is still unsigned. Read-only; derived from the expiration supplied on creation.
                    format: date-time
                    readOnly: true
                    type: string
                expireAfter:
                    description:
                        Days until the request expires. Zero leaves it open. Supplied on creation; not returned on read.
                    type: integer
                expireWarn:
                    description:
                        Days before expiration to warn the signers. Must be fewer than the days until expiration. Supplied on creation; not returned on read.
                    type: integer
                fileEntryIds:
                    description:
                        Document library file entries to be signed. Supplied on creation; not returned on read.
                    items:
                        format: int64
                        type: integer
                    type: array
                id:
                    description:
                        Identifier of the request. Read-only; assigned by the server.
                    format: int64
                    readOnly: true
                    type: integer
                name:
                    description:
                        Name of the request. Supplied on creation; not returned on read.
                    type: string
                sendNotifications:
                    description:
                        Whether Liferay emails each signer a link to sign. Defaults to true. Supplied on creation; not returned on read.
                    type: boolean
                signatureRequestRecipients:
                    description:
                        The signers on the request. Supply a user identifier for each one when creating; every other field is read-only.
                    items:
                        $ref: "#/components/schemas/SignatureRequestRecipient"
                    type: array
                status:
                    description:
                        Status of the request as Liferay last recorded it. Read-only.
                    readOnly: true
                    type: string
                statusDate:
                    description:
                        When the status last changed. Read-only.
                    format: date-time
                    readOnly: true
                    type: string
            type: object
        SignatureRequestRecipient:
            description:
                One signer on a signature request.
            properties:
                emailAddress:
                    description:
                        Email address of the signer. Read-only; taken from the user.
                    readOnly: true
                    type: string
                name:
                    description:
                        Name of the signer. Read-only; taken from the user.
                    readOnly: true
                    type: string
                sentDate:
                    description:
                        When the signer was notified. Read-only.
                    format: date-time
                    readOnly: true
                    type: string
                status:
                    description:
                        Status of this signer. Read-only.
                    readOnly: true
                    type: string
                statusDate:
                    description:
                        When this signer's status last changed. Read-only.
                    format: date-time
                    readOnly: true
                    type: string
                userId:
                    description:
                        Liferay user who must sign. Required when creating a request.
                    format: int64
                    type: integer
            type: object
info:
    description:
        "A Java client JAR is available for use with the group ID 'com.liferay', artifact ID 'com.liferay.digital.signature.rest.client', and version '1.0.37'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: ""
    version: v1.0
openapi: 3.0.1
paths:
    "/signature-requests/{signatureRequestId}":
        get:
            description:
                Retrieves a signature request. Requires VIEW permission on the request.
            operationId: getSignatureRequest
            parameters:
                -   in: path
                    name: signatureRequestId
                    required: true
                    schema:
                        format: int64
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SignatureRequest"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/SignatureRequest"
            tags: ["SignatureRequest"]
    "/signature-requests/{signatureRequestId}/notifications":
        post:
            description:
                Sends each signer whose turn it is a link to sign the request. Requires UPDATE permission on the request.
            operationId: postSignatureRequestNotification
            parameters:
                -   in: path
                    name: signatureRequestId
                    required: true
                    schema:
                        format: int64
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SignatureRequest"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/SignatureRequest"
            tags: ["SignatureRequest"]
    "/signature-requests/{signatureRequestId}/void":
        post:
            description:
                Voids the signature request with the provider and records the reason. Requires UPDATE permission on the request.
            operationId: postSignatureRequestVoid
            parameters:
                -   in: path
                    name: signatureRequestId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: voidReason
                    required: true
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SignatureRequest"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/SignatureRequest"
            tags: ["SignatureRequest"]
    "/sites/{siteId}/ds-envelopes":
        get:
            operationId: getSiteDSEnvelopesPage
            parameters:
                -   in: path
                    name: siteId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: fromDate
                    schema:
                        type: string
                -   in: query
                    name: keywords
                    schema:
                        type: string
                -   in: query
                    name: order
                    schema:
                        type: string
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: status
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/DSEnvelope"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/DSEnvelope"
                                type: array
            tags: ["DSEnvelope"]
        post:
            operationId: postSiteDSEnvelope
            parameters:
                -   in: path
                    name: siteId
                    required: true
                    schema:
                        format: int64
                        type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/DSEnvelope"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/DSEnvelope"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DSEnvelope"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/DSEnvelope"
            tags: ["DSEnvelope"]
    "/sites/{siteId}/ds-envelopes/{dsEnvelopeId}":
        get:
            operationId: getSiteDSEnvelope
            parameters:
                -   in: path
                    name: siteId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: path
                    name: dsEnvelopeId
                    required: true
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DSEnvelope"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/DSEnvelope"
            tags: ["DSEnvelope"]
    "/sites/{siteId}/ds-recipient-view-definition/{dsEnvelopeId}":
        post:
            operationId: postSiteDSRecipientViewDefinition
            parameters:
                -   in: path
                    name: siteId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: path
                    name: dsEnvelopeId
                    required: true
                    schema:
                        type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/DSRecipientViewDefinition"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/DSRecipientViewDefinition"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DSEnvelopeSignatureURL"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/DSEnvelopeSignatureURL"
            tags: ["DSRecipientViewDefinition"]
    "/sites/{siteId}/signature-requests":
        get:
            description:
                Retrieves the signature requests of the site.
            operationId: getSiteSignatureRequestsPage
            parameters:
                -   in: path
                    name: siteId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: search
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/SignatureRequest"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/SignatureRequest"
                                type: array
            tags: ["SignatureRequest"]
        post:
            description:
                Sends the documents to the signers through the signature provider and records the signature request. Requires permission to add signature requests and UPDATE permission on each document.
            operationId: postSiteSignatureRequest
            parameters:
                -   in: path
                    name: siteId
                    required: true
                    schema:
                        format: int64
                        type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SignatureRequest"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/SignatureRequest"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SignatureRequest"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/SignatureRequest"
            tags: ["SignatureRequest"]