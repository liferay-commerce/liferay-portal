                code (`0`, `1`, `2`) or the human label (`Dimensions`, `Weight`, `Unit`). Calls
                `CPMeasurementUnitService.getCPMeasurementUnits(companyId, type, ...)`, applying the `page` (1-based)
                and `pageSize` (defaults to the server-configured page size) query parameters to bound the response. The
                `sort` query parameter is accepted on the wire but currently discarded by the resource implementation.
                The service call is issued with a null `OrderByComparator`, so the response is unaffected by the
                expression. When the type cannot be resolved, returns an empty list (the underlying
                `CPMeasurementUnitTypeException` is swallowed at debug level).
