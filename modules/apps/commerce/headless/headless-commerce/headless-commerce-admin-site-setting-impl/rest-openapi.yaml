servers:
    -   description:
            Liferay Commerce API server
        url: https://commerce.{environment}.liferay.com/commerce-admin-site-setting/{basePath}
        variables:
            basePath:
                default: v1.0
            environment:
                default: api
                enum:
                    -   api
                    -   api.dev
                    -   api.uat
    -   description:
            Liferay Commerce Local Development (Hosts file)
        url: "{protocol}://{host}:{port}/o/commerce-admin-site-setting/{basePath}"
        variables:
            basePath:
                default: v1.0
            host:
                default: test.dev
            port:
                default: "8080"
                enum:
                    -   "443"
                    -   "8080"
                    -   "8443"
            protocol:
                default: http
                enum:
                    -   http
                    -   https
    -   description:
            Liferay Commerce Local Development with Ngrok
        url: "{protocol}://{host}.ngrok.io/o/commerce-admin-site-setting/{basePath}"
        variables:
            basePath:
                default: v1.0
            host:
                default: commerce
            protocol:
                default: http
                enum:
                    -   http
                    -   https
    -   description:
            SwaggerHub API Auto Mocking
        url: https://virtserver.swaggerhub.com/liferay6/commerce-admin-site-setting/v1.0
tags:
    -   description:
            Named restock-time windows (for example, `Available in 1-3 weeks`) shown on out-of-stock storefront items to
            communicate when the merchant expects them to become available again. Records are company-scoped on the
            server.
        name: AvailabilityEstimate
    -   description:
            Units of measure (`Dimensions`, `Weight`, `Unit`) used by SKUs and shipping rules, with per-company
            primary-unit and conversion-rate semantics.
        name: MeasurementUnit
    -   description:
            Classifications used to group SKUs that share the same tax treatment. Records are company-scoped on the
            server and referenced by pricing and tax engines to resolve the applicable rate.
        name: TaxCategory
    -   description:
            Warehouse definitions (name, postal address, geolocation, active flag) addressed through this admin API.
            Records are company-scoped on the server. Per-SKU stock levels and account/group/channel scoping live in the
            admin-inventory API.
        name: Warehouse