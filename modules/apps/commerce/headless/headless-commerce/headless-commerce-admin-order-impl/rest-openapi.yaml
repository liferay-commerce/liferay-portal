components:
    parameters:
        attachmentExternalReferenceCodePathParam:
            description: External reference code that addresses an attachment under an order. The code is the integration-supplied idempotency key, unique per attachment within the company.
            explode: false
            in: path
            name: attachmentExternalReferenceCode
            required: true
            schema:
                description: The attachment external reference code
                example: AB-34098-789-N
                minLength: 1
                type: string
            style: simple
        attachmentIdPathParam:
            description: Internal numeric identifier of the target order attachment (CommerceOrderAttachment).
            explode: false
            in: path
            name: attachmentId
            required: true
            schema:
                description: The attachment Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
        externalReferenceCodePathParam:
            description: External reference code that addresses the target resource on the by-externalReferenceCode paths. The code is the integration-supplied idempotency key, unique within the resource scope; POST against this path is upsert (create when absent, replace when present).
            explode: false
            in: path
            name: externalReferenceCode
            required: true
            schema:
                description: The resource external reference code
                example: AB-34098-789-N
                minLength: 1
                type: string
            style: simple
        filterQueryParam:
            description: OData v4 filter expression that narrows the result set. Supported fields depend on the endpoint and are sourced from the matching entity model -- typically accountId, channelId, orderStatus, orderTypeId, paymentStatus, sku, name, and createDate. Example -- filter=orderStatus eq 10.
            explode: true
            in: query
            name: filter
            required: false
            schema:
                type: string
            style: form
        idPathParam:
            description: Internal numeric identifier of the target resource. Counterpart to the by-externalReferenceCode path variant; identifiers are server-assigned and stable across the resource lifetime.
            explode: false
            in: path
            name: id
            required: true
            schema:
                description: The resource Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
        orderIdPathParam:
            description: Internal numeric identifier of the target order (CommerceOrder). Used as the parent context when accessing nested resources (items, notes, attachments, addresses).
            explode: false
            in: path
            name: orderId
            required: true
            schema:
                description: The order Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
        orderRuleAccountGroupIdPathParam:
            description: Internal numeric identifier of an order-rule-to-account-group relationship (COREntryRel).
            explode: false
            in: path
            name: orderRuleAccountGroupId
            required: true
            schema:
                description: The order rule account group relationship Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
        orderRuleAccountIdPathParam:
            description: Internal numeric identifier of an order-rule-to-account relationship (COREntryRel).
            explode: false
            in: path
            name: orderRuleAccountId
            required: true
            schema:
                description: The order rule account relationship Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
        orderRuleChannelIdPathParam:
            description: Internal numeric identifier of an order-rule-to-channel relationship (COREntryRel).
            explode: false
            in: path
            name: orderRuleChannelId
            required: true
            schema:
                description: The order rule channel relationship Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
        orderRuleOrderTypeIdPathParam:
            description: Internal numeric identifier of an order-rule-to-order-type relationship (COREntryRel).
            explode: false
            in: path
            name: orderRuleOrderTypeId
            required: true
            schema:
                description: The order rule order type relationship Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
        orderTypeChannelIdPathParam:
            description: Internal numeric identifier of an order-type-to-channel relationship (CommerceOrderTypeRel).
            explode: false
            in: path
            name: orderTypeChannelId
            required: true
            schema:
                description: The order type channel relationship Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
        pageQueryParam:
            description: One-based page number used together with pageSize to navigate paginated result sets. Defaults to 1 when omitted.
            explode: true
            in: query
            name: page
            required: false
            schema:
                type: integer
            style: form
        pageSizeQueryParam:
            description: Number of items to return per page in paginated result sets. Defaults to the resource pagination configuration when omitted.
            explode: true
            in: query
            name: pageSize
            required: false
            schema:
                type: integer
            style: form
        searchQueryParam:
            description: Free-text search expression applied to the indexed search corpus of the target resource (for example, the creator email for orders, the SKU for order items, the name for order rules).
            explode: true
            in: query
            name: search
            required: false
            schema:
                type: string
            style: form
        sortQueryParam:
            description: Comma-separated list of fields to sort by. Each field accepts the suffix :asc or :desc; sortable fields depend on the endpoint and are sourced from the matching entity model.
            explode: true
            in: query
            name: sort
            required: false
            schema:
                type: string
            style: form
        termOrderTypeIdPathParam:
            description: Internal numeric identifier of a term-to-order-type relationship (CommerceTermEntryRel).
            explode: false
            in: path
            name: termOrderTypeId
            required: true
            schema:
                description: The term order type relationship Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
    schemas:
        Account:
            description: An Account entity representing a customer account or organizational unit with billing contact info, identity, and type classification.
            properties:
                customFields:
                    additionalProperties: true
                    description: Map of custom field values, keyed by field name; values depend on custom field type.
                    type: object
                emailAddress:
                    description: Primary email contact for the account.
                    format: email
                    type: string
                externalReferenceCode:
                    description: Idempotency key for create and update; must be unique per account within the company.
                    example: AB-34098-789-N
                    type: string
                id:
                    description: Unique account identifier (FK to AccountEntry.accountEntryId).
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                logoId:
                    description: File entry ID of the account's logo image (FK).
                    example: 20078
                    format: int64
                    minimum: 0
                    type: integer
                name:
                    description: Display name of the account.
                    example: Account Name
                    type: string
                root:
                    description: Boolean indicating whether this is a root/parent account (vs. subsidiary).
                    example: true
                    type: boolean
                taxId:
                    description: Tax identification number for the account (e.g., VAT, EIN).
                    example: Abcd1234
                    type: string
                type:
                    description: Account type code ; typically 1 for B2B accounts. Mapping -- 0=Person, 1=Business, 2=Guest.
                    example: 1
                    format: int32
                    maximum: 2
                    minimum: 0
                    type: integer
        Attachment:
            description: A file attachment associated with an order, including file metadata, URL, access control (restricted flag), and priority ranking.
            properties:
                actions:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    description: Map of HATEOAS actions available to the current user, keyed by action name (e.g., "delete", "update"). Each value carries the href template and HTTP method, computed dynamically from user permissions. Read-only.
                    readOnly: true
                    type: object
                attachment:
                    description: Base64 encoded file
                    format: byte
                    type: string
                dateModified:
                    description: ISO 8601 timestamp of last modification. Read-only.
                    format: date-time
                    readOnly: true
                    type: string
                extension:
                    description: File extension (e.g., "pdf", "jpg") extracted from file entry. Read-only.
                    readOnly: true
                    type: string
                externalReferenceCode:
                    description: Idempotency key for create and update; must be unique per attachment within the company.
                    example: AB-34098-789-N
                    type: string
                fileName:
                    description: Original filename when uploaded.
                    type: string
                id:
                    description: Unique attachment identifier (FK to CommerceOrderAttachment.commerceOrderAttachmentId). Read-only.
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                priority:
                    description: Numeric sort order for displaying multiple attachments (0.0 = highest).
                    format: double
                    type: number
                restricted:
                    description: Boolean; if true, attachment is internal-only (not visible to customer/storefront).
                    example: false
                    type: boolean
                title:
                    description: Display title for the attachment (may differ from fileName).
                    type: string
                type:
                    description: Classification type (from list type definition L_COMMERCE_ORDER_ATTACHMENT_TYPES); allows custom type taxonomy.
                    type: string
                typeLabel:
                    description: Localized label for the type code. Read-only.
                    readOnly: true
                    type: string
                url:
                    description: Fully-qualified download URL for the file. Read-only.
                    readOnly: true
                    type: string
            type: object
        BillingAddress:
            description: A postal address entity designated as the billing address for an order, including street, city, postal code, state, and country codes.
            properties:
                city:
                    description: City name.
                    example: Diamond Bar
                    type: string
                countryISOCode:
                    description: ISO 3166-1 alpha-2 country code (e.g., US, DE, FR).
                    example: US
                    type: string
                description:
                    description: Free-text notes or directions for delivery (e.g., "suite 200, north building").
                    example: right stairs, first room on the left
                    type: string
                externalReferenceCode:
                    description: Idempotency key for create and update; must be unique per address within the company.
                    example: AB-34098-789-N
                    readOnly: true
                    type: string
                id:
                    description: Unique address identifier (FK to CommerceAddress.commerceAddressId).
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                latitude:
                    description: Decimal latitude for geocoding.
                    example: 33.9976884
                    format: double
                    type: number
                longitude:
                    description: Decimal longitude for geocoding.
                    example: -117.8144595
                    format: double
                    type: number
                name:
                    description: Address name/label (e.g., "Head Office", "Warehouse").
                    example: Alessio Antonio Rendina
                    type: string
                phoneNumber:
                    description: Phone number associated with the address.
                    example: (123) 456 7890
                    type: string
                regionISOCode:
                    description: ISO 3166-2 sub-region code (province or state) within the country (for example, CA, NY).
                    example: CA
                    type: string
                street1:
                    description: Primary street address line.
                    example: 1400 Montefino Ave
                    type: string
                street2:
                    description: Secondary street address line (apartment, suite, etc.).
                    example: 1st floor
                    type: string
                street3:
                    description: Tertiary street address line.
                    example: suite 200
                    type: string
                subtype:
                    description: Address subtype classifier (for example, billing or shipping default). Free-text identifier.
                    example: box
                    type: string
                vatNumber:
                    description: VAT or tax registration number associated with the address.
                    example: "353246836565"
                    type: string
                zip:
                    description: ZIP or postal code for the address.
                    example: "91765"
                    type: string
            required:
            - city
            - countryISOCode
            - name
            - street1
            type: object
        Channel:
            description: A Commerce Channel entity representing a sales channel (store, marketplace, etc.) that groups products and orders.
            properties:
                currencyCode:
                    description: ISO 4217 currency code (e.g., USD, EUR) used by default in this channel.
                    example: USD
                    type: string
                externalReferenceCode:
                    description: Idempotency key; must be unique per channel within the company.
                    example: AB-34098-789-N
                    type: string
                id:
                    description: Unique channel identifier (FK to CommerceChannel.commerceChannelId).
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                name:
                    description: Display name of the sales channel.
                    example: Alessio Antonio Rendina
                    type: string
                type:
                    description: Channel type classification (e.g., "web", "marketplace", "physical-store").
                    type: string
            type: object
        Error:
            description: Standard error response containing HTTP status code, error message, and error type identifier.
            properties:
                errorCode:
                    description: Internal error code mapping
                    example: 996
                    readOnly: true
                    type: integer
                errorDescription:
                    description: Human-readable description of the error condition. Read-only.
                    example: Unable to find currency. Currency code should be expressed with 3-letter ISO 4217 format.
                    readOnly: true
                    type: string
                message:
                    description: Developer-facing message that pinpoints the failing field or service call. Read-only.
                    example: No CommerceCurrency exists with the key {groupId=41811, code=US Dollar}
                    readOnly: true
                    type: string
                status:
                    description: HTTP Status code
                    example: 404
                    readOnly: true
                    type: integer
            required:
            - errorCode
            - errorDescription
            - message
            - status
            type: object
        Order:
            description: A commerce order entity capturing purchase details including account, items, pricing, addresses, shipping/payment terms, order status, and nested relationships.
            properties:
                account:
                    $ref: "#/components/schemas/Account"
                    readOnly: true
                accountExternalReferenceCode:
                    description: External reference code of the account; used for lookup if accountId is not provided.
                    example: AAB-34098-789-N
                    type: string
                accountId:
                    description: Reference to the Account entity (FK). Identifies the customer/buyer.
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                actions:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    description: Map of HATEOAS actions (delete, get, update) available to the current user. Read-only.
                    readOnly: true
                    type: object
                advanceStatus:
                    description: Free-text status field for custom order workflows (e.g., "on-hold", "escalated").
                    example: trasmitted
                    type: string
                author:
                    description: Display name of the user who created the Order. Read-only.
                    readOnly: true
                    type: string
                billingAddress:
                    $ref: "#/components/schemas/BillingAddress"
                billingAddressExternalReferenceCode:
                    description: External reference code of the billing address; used for lookup if billingAddressId not provided.
                    example: AAB-34098-789-N
                    type: string
                billingAddressId:
                    description: Reference to the CommerceAddress (FK) used as billing address.
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                channel:
                    $ref: "#/components/schemas/Channel"
                    readOnly: true
                channelExternalReferenceCode:
                    description: External reference code of the channel entity. Used as a lookup key in place of the numeric channelId.
                    example: AAB-34098-789-N
                    type: string
                channelId:
                    description: Reference to the CommerceChannel entity (FK). Identifies the sales channel where the order was placed.
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                couponCode:
                    description: Coupon code applied to the order. Drives matching commerce discount rules.
                    example: save20
                    type: string
                createDate:
                    description: ISO 8601 timestamp of order creation. Read-only.
                    example: 2017-07-21
                    format: date
                    type: string
                creatorEmailAddress:
                    description: Email address of the user who created the order. Read-only.
                    format: email
                    type: string
                currencyCode:
                    description: ISO 4217 currency code (e.g., USD, EUR) for order totals.
                    example: USD
                    type: string
                currencyExternalReferenceCode:
                    description: External reference code of the currency entity; used for lookup if currencyId not provided.
                    example: AAB-34098-789-N
                    type: string
                currencyId:
                    description: Reference to the CommerceCurrency entity (FK).
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                customFields:
                    additionalProperties: true
                    description: Map of custom field values; handled by expando bridge.
                    type: object
                deliveryTermDescription:
                    description: Description of the deliveryTerm entity. Read-only.
                    example: Orders delivery terms description
                    readOnly: true
                    type: string
                deliveryTermExternalReferenceCode:
                    description: External reference code of the delivery term; used for lookup.
                    example: AAB-34098-789-N
                    type: string
                deliveryTermId:
                    description: Reference to a CommerceTermEntry (FK) representing delivery terms.
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                deliveryTermName:
                    description: Display name of the deliveryTerm entity. Read-only.
                    example: Orders delivery terms name
                    readOnly: true
                    type: string
                externalReferenceCode:
                    description: Idempotency key for create and update; must be unique per order within the company.
                    example: AB-34098-789-N
                    type: string
                id:
                    description: Unique order identifier (FK to CommerceOrder.commerceOrderId). Read-only.
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                lastPriceUpdateDate:
                    description: ISO 8601 timestamp of the most recent price recalculation on the order.
                    example: 2017-07-21
                    format: date
                    type: string
                modifiedDate:
                    description: ISO 8601 timestamp of last modification. Read-only.
                    example: 2017-08-21
                    format: date
                    type: string
                name:
                    description: Free-text order name or label.
                    example: Order Name
                    type: string
                orderDate:
                    description: ISO 8601 timestamp when the order was placed (may differ from createDate if imported). Server timezone to UTC ISO 8601 format.
                    example: 2017-07-21
                    format: date
                    type: string
                orderItems:
                    description: Nested array of OrderItem objects. Write-only on POST/PATCH; items not in the array are deleted (upsert-by-ID semantics).
                    items:
                        $ref: "#/components/schemas/OrderItem"
                    type: array
                orderStatus:
                    description: Integer order status code . Drives workflow state. Mapping -- 0=Pending, 1=Open, 9=Subscription, 10=Processing, 13=AwaitingPickup, 14=PartiallyShipped, 15=Shipped, 16=Declined/Approved/Completed, 17=Refunded, 18=Disputed, 19=PartiallyRefunded, 20=OnHold, 21=QuoteRequested, 22=QuoteProcessed.
                    example: 0
                    format: int32
                    minimum: 0
                    type: integer
                orderStatusInfo:
                    $ref: "#/components/schemas/Status"
                    readOnly: true
                orderTypeExternalReferenceCode:
                    description: External reference code of the order type; used for lookup.
                    example: AB-34098-789-N
                    type: string
                orderTypeId:
                    description: Reference to a CommerceOrderType (FK) for order classification.
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                paymentMethod:
                    description: Free-text payment method identifier or name (e.g., "credit_card", "purchase_order").
                    example: paypal
                    type: string
                paymentStatus:
                    description: Integer payment status code . Mapping -- 0=Pending, 1=Authorized (Draft), 2=Completed (Approved), 4=Failed (Denied), 17=Refunded, 23=NotRequired.
                    example: 0
                    format: int32
                    minimum: 0
                    type: integer
                paymentStatusInfo:
                    $ref: "#/components/schemas/Status"
                    readOnly: true
                paymentTermDescription:
                    description: Description of the paymentTerm entity. Read-only.
                    example: Orders payment terms description
                    readOnly: true
                    type: string
                paymentTermExternalReferenceCode:
                    description: External reference code of the payment term; used for lookup.
                    example: AAB-34098-789-N
                    type: string
                paymentTermId:
                    description: Reference to a CommerceTermEntry (FK) representing payment terms.
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                paymentTermName:
                    description: Display name of the paymentTerm entity. Read-only.
                    example: Orders payment terms name
                    readOnly: true
                    type: string
                printedNote:
                    description: Free-text memo or internal note on the order (e.g., "handle with care").
                    example: Order printed note
                    type: string
                purchaseOrderNumber:
                    description: Free-text PO number or external order identifier from buyer.
                    example: Abcd1234
                    type: string
                requestedDeliveryDate:
                    description: ISO 8601 timestamp for desired delivery date. Server timezone to UTC ISO 8601 format.
                    example: 2017-07-21
                    format: date
                    type: string
                shippable:
                    description: When true, the order (or its product) ships physically; when false, it is virtual or non-shippable. Read-only.
                    example: true
                    readOnly: true
                    type: boolean
                shippingAddress:
                    $ref: "#/components/schemas/ShippingAddress"
                shippingAddressExternalReferenceCode:
                    description: External reference code of the shipping address; used for lookup if shippingAddressId not provided.
                    example: AAB-34098-789-N
                    type: string
                shippingAddressId:
                    description: Reference to the CommerceAddress (FK) used as shipping address.
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                shippingAmount:
                    description: BigDecimal shipping charge (tax-exclusive). Currency and precision determined by channel/order currency.
                    example: 12
                    format: bigdecimal
                    minimum: 0
                    type: number
                shippingAmountFormatted:
                    description: Locale-aware formatted string representation of the shippingAmount amount, including the currency symbol. Read-only.
                    type: string
                shippingAmountValue:
                    description: Raw BigDecimal value of the shippingAmount field, without currency formatting.
                    example: 12
                    format: double
                    minimum: 0
                    type: number
                shippingDiscountAmount:
                    description: BigDecimal total discount applied to shipping (across all discount levels).
                    format: bigdecimal
                    type: number
                shippingDiscountAmountFormatted:
                    description: Locale-aware formatted string representation of the shippingDiscountAmount amount, including the currency symbol. Read-only.
                    type: string
                shippingDiscountAmountValue:
                    description: Raw BigDecimal value of the shippingDiscountAmount field, without currency formatting.
                    format: double
                    type: number
                shippingDiscountPercentageLevel1:
                    description: BigDecimal level-1 tiered discount percentage applied to the order (tax-exclusive).
                    example: 20
                    format: bigdecimal
                    minimum: 0
                    type: number
                shippingDiscountPercentageLevel1WithTaxAmount:
                    description: BigDecimal shippingDiscountPercentageLevel1 value with tax included. Currency follows the order or channel currency.
                    example: 20
                    format: bigdecimal
                    minimum: 0
                    type: number
                shippingDiscountPercentageLevel2:
                    description: BigDecimal level-2 tiered discount percentage applied to the order (tax-exclusive).
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                shippingDiscountPercentageLevel2WithTaxAmount:
                    description: BigDecimal shippingDiscountPercentageLevel2 value with tax included. Currency follows the order or channel currency.
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                shippingDiscountPercentageLevel3:
                    description: BigDecimal level-3 tiered discount percentage applied to the order (tax-exclusive).
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                shippingDiscountPercentageLevel3WithTaxAmount:
                    description: BigDecimal shippingDiscountPercentageLevel3 value with tax included. Currency follows the order or channel currency.
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                shippingDiscountPercentageLevel4:
                    description: BigDecimal level-4 tiered discount percentage applied to the order (tax-exclusive).
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                shippingDiscountPercentageLevel4WithTaxAmount:
                    description: BigDecimal shippingDiscountPercentageLevel4 value with tax included. Currency follows the order or channel currency.
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                shippingDiscountWithTaxAmount:
                    description: BigDecimal total shipping discount with tax included.
                    format: bigdecimal
                    type: number
                shippingDiscountWithTaxAmountFormatted:
                    description: Locale-aware formatted string representation of the shippingDiscountWithTaxAmount amount, including the currency symbol. Read-only.
                    type: string
                shippingMethod:
                    description: Free-text name of the shipping method (e.g., "Standard Ground", "Express 2-Day").
                    example: fixed
                    type: string
                shippingOption:
                    description: Free-text customer-visible shipping option label.
                    example: by Air
                    type: string
                shippingWithTaxAmount:
                    description: BigDecimal shipping charge (tax-inclusive).
                    example: 12
                    format: bigdecimal
                    minimum: 0
                    type: number
                shippingWithTaxAmountFormatted:
                    description: Locale-aware formatted string representation of the shippingWithTaxAmount amount, including the currency symbol. Read-only.
                    type: string
                shippingWithTaxAmountValue:
                    description: Raw BigDecimal value of the shippingWithTaxAmount field, without currency formatting.
                    example: 12
                    format: double
                    minimum: 0
                    type: number
                subtotal:
                    description: BigDecimal sum of line item prices before discounts and tax.
                    format: bigdecimal
                    type: number
                subtotalAmount:
                    description: BigDecimal subtotal value (tax-exclusive). Currency follows the order or channel currency.
                    format: double
                    readOnly: true
                    type: number
                subtotalDiscountAmount:
                    description: BigDecimal total discount applied to subtotal.
                    format: bigdecimal
                    type: number
                subtotalDiscountAmountFormatted:
                    description: Locale-aware formatted string representation of the subtotalDiscountAmount amount, including the currency symbol. Read-only.
                    type: string
                subtotalDiscountPercentageLevel1:
                    description: BigDecimal level-1 tiered discount percentage applied to the order (tax-exclusive).
                    example: 20
                    format: bigdecimal
                    minimum: 0
                    type: number
                subtotalDiscountPercentageLevel1WithTaxAmount:
                    description: BigDecimal subtotalDiscountPercentageLevel1 value with tax included. Currency follows the order or channel currency.
                    example: 20
                    format: bigdecimal
                    minimum: 0
                    type: number
                subtotalDiscountPercentageLevel2:
                    description: BigDecimal level-2 tiered discount percentage applied to the order (tax-exclusive).
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                subtotalDiscountPercentageLevel2WithTaxAmount:
                    description: BigDecimal subtotalDiscountPercentageLevel2 value with tax included. Currency follows the order or channel currency.
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                subtotalDiscountPercentageLevel3:
                    description: BigDecimal level-3 tiered discount percentage applied to the order (tax-exclusive).
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                subtotalDiscountPercentageLevel3WithTaxAmount:
                    description: BigDecimal subtotalDiscountPercentageLevel3 value with tax included. Currency follows the order or channel currency.
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                subtotalDiscountPercentageLevel4:
                    description: BigDecimal level-4 tiered discount percentage applied to the order (tax-exclusive).
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
