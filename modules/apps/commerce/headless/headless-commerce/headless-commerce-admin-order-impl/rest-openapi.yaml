            properties:
                actions:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    description: Map of HATEOAS actions (delete). Read-only.
                    readOnly: true
                    type: object
                channel:
                    $ref: "#/components/schemas/Channel"
                    readOnly: true
                channelExternalReferenceCode:
                    description: External reference code of the channel; used for lookup if channelId not provided.
                    example: PAB-34098-789-N
                    type: string
                channelId:
                    description: Reference to the CommerceChannel entity (FK).
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                orderTypeChannelId:
                    description: Reference to the orderTypeChannel entity (FK).
                    example: 30643
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                orderTypeExternalReferenceCode:
                    description: External reference code of the orderType entity. Used as a lookup key in place of the numeric orderTypeId.
                    example: DAB-34098-789-N
                    type: string
                orderTypeId:
                    description: Reference to the orderType entity (FK).
                    example: 30324
                    format: int64
                    minimum: 0
                    type: integer
            required:
            - channelId
            - orderTypeId
            type: object
        ShippingAddress:
            description: A postal address entity designated as the shipping address for an order or order item.
            properties:
                city:
                    description: City name.
                    example: Diamond Bar
                    type: string
                countryISOCode:
                    description: ISO 3166-1 alpha-2 country code.
                    example: US
                    type: string
                description:
                    description: Free-text notes or directions for delivery.
                    example: right stairs, first room on the left
                    type: string
                externalReferenceCode:
                    description: Idempotency key for create and update; must be unique per address within the company.
                    example: AB-34098-789-N
                    readOnly: true
                    type: string
                id:
                    description: Unique address identifier (FK to CommerceAddress.commerceAddressId).
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                latitude:
                    description: Decimal latitude for geocoding.
                    example: 33.9976884
                    format: double
                    type: number
                longitude:
                    description: Decimal longitude for geocoding.
                    example: -117.8144595
                    format: double
                    type: number
                name:
                    description: Address name/label.
                    example: Alessio Antonio Rendina
                    type: string
                phoneNumber:
                    description: Phone number associated with the address.
                    example: (123) 456 7890
                    type: string
                regionISOCode:
                    description: ISO 3166-2 sub-region code (province or state) within the country (for example, CA, NY).
                    example: CA
                    type: string
                street1:
                    description: Primary street address line.
                    example: 1400 Montefino Ave
                    type: string
                street2:
                    description: Secondary street address line.
                    example: 1st floor
                    type: string
                street3:
                    description: Tertiary street address line.
                    example: suite 200
                    type: string
                subtype:
                    description: Address subtype classifier (for example, billing or shipping default). Free-text identifier.
                    example: box
                    type: string
                zip:
                    description: ZIP or postal code for the address.
                    example: "91765"
                    type: string
            required:
            - city
            - countryISOCode
            - name
            - street1
            type: object
        Status:
            description: A status code enumeration representing order workflow states (pending, processing, completed, cancelled, etc.).
            properties:
                code:
                    description: Integer status code value.
                    format: int32
                    readOnly: true
                    type: integer
                label:
                    description: Human-readable label for the status (e.g., "Pending", "Processing", "Completed").
                    example: black
                    type: string
                label_i18n:
                    description: Localized text. Map keys are locale codes (for example, en_US, it_IT); values are the translated strings.
                    example: black
                    type: string
            type: object
        Term:
            description: A commerce term entry (delivery or payment term) that can be linked to orders and order types via TermOrderType.
            properties:
                actions:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    description: Map of HATEOAS actions available to the current user. Read-only.
                    readOnly: true
                    type: object
                active:
                    description: Boolean activation flag for the term.
                    example: true
                    type: boolean
                createDate:
                    description: ISO 8601 timestamp of when the Term was created. Read-only.
                    example: 2017-07-21
                    format: date
                    type: string
                description:
                    additionalProperties:
                        type: string
                    description: Localized text. Map keys are locale codes; values are the translated descriptions.
                    example:
                        en_US: Term Description US
                        hr_HR: Term Description HR
                        hu_HU: Term Description HU
                    type: object
                displayDate:
                    description: ISO 8601 date when the term becomes active.
                    example: 2017-07-21
                    format: date
                    type: string
                expirationDate:
                    description: ISO 8601 date when the term expires.
                    example: 2017-08-21
                    format: date
                    type: string
                externalReferenceCode:
                    description: Idempotency key for create and update; must be unique per term within the company.
                    example: AB-34098-789-N
                    type: string
                id:
                    description: Unique term identifier (FK to CommerceTermEntry.commerceTermEntryId). Read-only.
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                label:
                    additionalProperties:
                        type: string
                    description: Localized text. Map keys are locale codes; values are the translated labels (display names).
                    example:
                        en_US: Term Label US
                        hr_HR: Term Label HR
                        hu_HU: Term Label HU
                    type: object
                name:
                    description: Free-text name/identifier for the term (e.g., "Net30", "2/10 Net30").
                    example: Laptops, Beverages
                    type: string
                neverExpire:
                    description: Boolean; if true, ignores expirationDate and term never expires.
                    example: true
                    type: boolean
                priority:
                    description: Double numeric priority for term evaluation order.
                    example: 1.2
                    format: double
                    type: number
                termOrderType:
                    description: Nested array of TermOrderType objects describing which order types the term applies to.
                    items:
                        $ref: "#/components/schemas/TermOrderType"
                    type: array
                type:
                    description: Free-text term type identifier (e.g., "delivery", "payment").
                    example: payment-terms
                    type: string
                typeLocalized:
                    description: Localized text. Map keys are locale codes; values are the translated strings.
                    example: Payment Terms
                    type: string
                typeSettings:
                    description: Free-text or JSON settings/configuration specific to the term type.
                    type: string
                workflowStatusInfo:
                    $ref: "#/components/schemas/Status"
                    readOnly: true
            required:
            - name
            - type
            type: object
        TermOrderType:
            description: A relationship entity linking an order type to a term for term applicability to specific order types.
            properties:
                actions:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    description: Map of HATEOAS actions (delete). Read-only.
                    readOnly: true
                    type: object
                orderType:
                    $ref: "#/components/schemas/OrderType"
                    readOnly: true
                orderTypeExternalReferenceCode:
                    description: External reference code of the order type; used for lookup.
                    example: DAB-34098-789-N
                    type: string
                orderTypeId:
                    description: Reference to the CommerceOrderType entity (FK).
                    example: 30324
                    format: int64
                    minimum: 0
                    type: integer
                termExternalReferenceCode:
                    description: External reference code of the term entity. Used as a lookup key in place of the numeric termId.
                    example: PAB-34098-789-N
                    type: string
                termId:
                    description: Denormalized term ID (may be same as id in some implementations).
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                termOrderTypeId:
                    description: Reference to the termOrderType entity (FK).
                    example: 30643
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
            required:
            - orderTypeId
            - termId
            type: object
        VirtualItem:
            description: A virtual/digital product item within an order (extends OrderItem concept for non-physical goods).
            properties:
                url:
                    description: Fully qualified URL where the resource asset can be downloaded. Read-only.
                    example: http://www.liferay.com
                    type: string
                usages:
                    description: Maximum number of times the virtual asset can be redeemed. 0 -- unlimited.
                    format: int32
                    type: integer
                version:
                    description: Version label of the virtual asset (for example, v1.0.0).
                    example: v1.0.0
                    type: string
            type: object
    securitySchemes:
        BasicAuth:
            scheme: basic
            type: http
        BearerAuth:
            scheme: bearer
            type: http
        OAuth2:
            flows:
                authorizationCode:
                    authorizationUrl: /oauth/authorize
                    scopes:
                        CommerceOpenApiAdmin.admin: Grants access to admin operations
                        CommerceOpenApiAdmin.read: Grants read access
                        CommerceOpenApiAdmin.write: Grants write access
                    tokenUrl: /oauth/token
            type: oauth2
info:
    contact:
        email: team-commerce@liferay.com
        name: Commerce Team
    description:
        "Administrative REST API for the Liferay Commerce order domain. It manages the core CommerceOrder entity
        end-to-end -- the order header (account, channel, currency, billing and shipping addresses, payment and delivery
        terms, totals and tax breakdown), the order items it contains, the order notes attached to it, the attachments
        uploaded against it, the order rules (COREntry) that drive discounting and validation, the order types that
        classify it, and the delivery and payment terms that bind to those order types. The API targets back-office
        administrators and integration tooling; the buyer-facing checkout and order-lookup surface lives in the
        headless-commerce-delivery-order module. Most resources are addressable both by internal ID (/<id>) and by
        external reference code (/by-externalReferenceCode/<externalReferenceCode>); POST against the
        external-reference-code path is upsert. PATCH applies JSON Merge Patch (only the supplied fields are modified),
        while PUT replaces the resource. For the storefront, customer-facing counterpart see
        headless-commerce-delivery-order; for catalog, pricing, account, channel, and inventory data see the matching
        headless-commerce-admin-* modules. -- Common workflows: Provision an order header end-to-end -- (1) POST /orders
        with accountId or accountExternalReferenceCode, channelId or channelExternalReferenceCode, currencyCode, and
        orderTypeId to create the CommerceOrder; (2) PATCH /orders/<id>/billing-address (or the by-externalReferenceCode
        variant) with a BillingAddress payload to set the billing address; (3) PATCH /orders/<id>/shipping-address to
        set the shipping address. -- Add and price line items -- (1) POST /orders/<id>/orderItems with sku, quantity,
        and optional options to add a CommerceOrderItem; (2) PATCH /orderItems/<id> to adjust quantity, options, or
        unitPrice (price overrides require the MANAGE_COMMERCE_ORDER_PRICES permission); (3) DELETE /orderItems/<id> to
        remove a line. -- Attach notes and files to an order -- (1) POST /orders/<id>/orderNotes with content and the
        restricted flag for internal-only notes; (2) POST /orders/<id>/attachments with a base64-encoded payload, title,
        and type to upload a file. -- Manage order rules and their bindings -- (1) POST /orderRules with name, type,
        priority, dates, and active flag to create the COREntry; (2) POST /orderRules/<id>/orderRuleChannels,
        /orderRuleAccountGroups, /orderRuleAccounts, and /orderRuleOrderTypes to bind the rule to channels, account
        groups, accounts, and order types respectively; (3) PATCH /orderRules/<id> to update fields or nested bindings
        (upsert semantics for nested arrays). -- Manage order types and their channels -- (1) POST /orderTypes with
        localized name and description, active flag, and displayOrder to create the CommerceOrderType; (2) POST
        /orderTypes/<id>/orderTypeChannels to expose the order type on specific commerce channels. -- Manage delivery
        and payment terms -- (1) POST /terms with type (delivery or payment), label, name, priority, and active flag to
        create the CommerceTermEntry; (2) POST /terms/<id>/termOrderTypes to bind the term to specific order types so it
        applies only when those order types are in use. A Java client JAR is available for use with the group ID
        'com.liferay', artifact ID 'com.liferay.headless.commerce.admin.order.client', and version '4.0.54'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Liferay Commerce Admin Order API
    version: v1.0
