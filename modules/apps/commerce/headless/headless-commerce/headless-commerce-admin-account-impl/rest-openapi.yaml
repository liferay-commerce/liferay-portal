components:
    parameters:
        accountExternalReferenceCodePathParam:
            description: External reference code of the related Account. Idempotency key for create and update; must be unique
                per Account within the company.
            explode: false
            in: path
            name: accountExternalReferenceCode
            required: true
            schema:
                example: AB-34098-789-N
                minLength: 1
                type: string
            style: simple
        externalReferenceCodePathParam:
            description: External reference code that identifies the resource. Idempotency key for create and update; must
                be unique per entity within the company.
            explode: false
            in: path
            name: externalReferenceCode
            required: true
            schema:
                example: AB-34098-789-N
                minLength: 1
                type: string
            style: simple
        filterQueryParam:
            description: OData v4 filter expression that narrows the result set. The filterable fields depend on the endpoint;
                see the operation description for the supported field list.
            explode: true
            in: query
            name: filter
            required: false
            schema:
                type: string
            style: form
        idPathParam:
            description: Internal primary key that identifies the resource.
            explode: false
            in: path
            name: id
            required: true
            schema:
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
        organizationIdPathParam:
            description: Internal primary key of the related Organization.
            explode: false
            in: path
            name: organizationId
            required: true
            schema:
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
        pageQueryParam:
            description: One-based page index used together with pageSize to slice the result set. The first page is 1.
            explode: true
            in: query
            name: page
            required: false
            schema:
                type: integer
            style: form
        pageSizeQueryParam:
            description: Maximum number of entries returned per page. The default value is 20 when the parameter is omitted.
            explode: true
            in: query
            name: pageSize
            required: false
            schema:
                type: integer
            style: form
        searchQueryParam:
            description: Free-text search expression matched against the indexed string fields of the underlying entity. The
                matched fields depend on the endpoint; see the operation description for the searched field list.
            explode: true
            in: query
            name: search
            required: false
            schema:
                type: string
            style: form
        sortQueryParam:
            description: Comma-separated list of sort expressions in the form <field>:asc or <field>:desc. The sortable fields
                depend on the endpoint; see the operation description for the supported field list.
            explode: true
            in: query
            name: sort
            required: false
            schema:
                type: string
            style: form
        userIdPathParam:
            description: Internal primary key of the related User.
            explode: false
            in: path
            name: userId
            required: true
            schema:
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
    responses:
        NotFound:
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
                application/xml:
                    schema:
                        $ref: "#/components/schemas/Error"
            description: The specified resource was not found
        UnauthorizedError:
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
                application/xml:
                    schema:
                        $ref: "#/components/schemas/Error"
            description: Authentication information is missing or invalid
    schemas:
        Account:
            properties:
                accountAddresses:
                    example:
                    -   city: Diamond Bar
                        countryISOCode: US
                        defaultBilling: true
                        defaultShipping: true
                        description: right stairs, first room on the left
                        id: 31130
                        latitude: 33.9976884
                        longitude: -117.8144595
                        name: Alessio Antonio Rendina
                        phoneNumber: (123) 456 7890
                        regionISOCode: CA
                        street1: 1400 Montefino Ave
                        street2: 1st floor
                        street3: suite 200
                        zip: "91765"
                    items:
                        $ref: "#/components/schemas/AccountAddress"
                    type: array
                    description: Addresses owned by this Account. Persisted in the same transaction when supplied on POST
                        or PATCH.
                accountMembers:
                    example:
                    -   description:
                            en_US: Account Administrator Description US
                            hr_HR: Account Administrator Description HR
                            hu_HU: Account Administrator Description HU
                    -   id: 31256
                        name: Alessio Antonio Rendina
                        roles:
                    items:
                        $ref: "#/components/schemas/AccountMember"
                    type: array
                    description: Members (user-to-account links) of this Account. Each member carries the user's account-scoped
                        AccountRoles.
                accountOrganizations:
                    example:
                    -   id: 20546
                        name: Liferay Italy
                        organizationId: 20433
                        treePath: /Liferay/Liferay Italy
                    items:
                        $ref: "#/components/schemas/AccountOrganization"
                    type: array
                    description: Liferay Organizations linked to this Account.
                active:
                    example: true
                    type: boolean
                    description: Whether the Account is active. Inactive accounts cannot place orders but remain visible in
                        the admin UI.
                customFields:
                    additionalProperties: true
                    type: object
                    description: Free-form custom field map. Keys are the registered custom field names; values follow the
                        type declared on the field definition.
                dateCreated:
                    description: Creation timestamp in ISO 8601 (UTC). Read-only.
                    format: date-time
                    readOnly: true
                    type: string
                dateModified:
                    description: Last modification timestamp in ISO 8601 (UTC). Read-only.
                    format: date-time
                    readOnly: true
                    type: string
                defaultBillingAccountAddressId:
                    example: 10130
                    format: int64
                    minimum: 0
                    type: integer
                    description: Reference to the AccountAddress entity (FK) used as the default billing address. Setting
                        this field clears the previous default billing flag on sibling addresses.
                defaultShippingAccountAddressId:
                    example: 10131
                    format: int64
                    minimum: 0
                    type: integer
                    description: Reference to the AccountAddress entity (FK) used as the default shipping address. Setting
                        this field clears the previous default shipping flag on sibling addresses.
                emailAddresses:
                    example:
                    - joe.1@commerce.com
                    - joe.2@commerce.com
                    - joe.3@commerce.com
                    items:
                        format: email
                        type: string
                    type: array
                    description: Email addresses associated with the Account. The first entry is the primary contact.
                externalReferenceCode:
                    example: AB-34098-789-N
                    type: string
                    description: Idempotency key for create and update; must be unique per Account within the company. Used
                        as the addressing key on the by-externalReferenceCode endpoints.
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                    description: Internal primary key. Read-only; assigned by the system on create.
                logoId:
                    example: 20078
                    format: int64
                    minimum: 0
                    type: integer
                    description: Reference to the DLFileEntry that stores the Account logo (FK). Set through the dedicated
                        logo upload endpoint.
                logoURL:
                    example: AB-34098-789-N
                    type: string
                    description: URL the front-end uses to fetch the Account logo. Computed; read-only.
                name:
                    example: Account Name
                    type: string
                    description: Display name of the Account.
                root:
                    example: true
                    type: boolean
                    description: Whether this Account is the root of an organizational hierarchy. Used by the auto-assign
                        feature.
                taxId:
                    example: Abcd1234
                    type: string
                    description: Tax identifier of the Account (for example, a VAT or EIN). Used on invoices.
                type:
                    example: 1
                    format: int32
                    maximum: 2
                    minimum: 0
                    type: integer
                    description: Integer Account type -- 0=GUEST, 1=PERSONAL, 2=BUSINESS. Sourced from AccountConstants; determines
                        the available members and address flows.
            required:
            - externalReferenceCode
            - name
            type: object
            description: Commerce buyer organization or end customer that places orders. Owns addresses, members (users with
                account-scoped roles), and links to Liferay Organizations and AccountGroups.
        AccountAddress:
            properties:
                city:
                    example: Diamond Bar
                    type: string
                    description: City name.
                countryISOCode:
                    example: US
                    type: string
                    description: Country ISO 3166-1 alpha-2 code (for example, US, IT, DE).
                defaultBilling:
                    example: true
                    type: boolean
                    description: Whether this address is the default billing address for the account. Setting this to true
                        clears the same flag on sibling addresses.
                defaultShipping:
                    example: true
                    type: boolean
                    description: Whether this address is the default shipping address for the account. Setting this to true
                        clears the same flag on sibling addresses.
                description:
                    example: right stairs, first room on the left
                    type: string
                    description: Free-form delivery hint or note attached to the address.
                externalReferenceCode:
                    example: AB-34098-789-N
                    type: string
                    description: Idempotency key for create and update; must be unique per address within the company.
                id:
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                    description: Internal primary key. Read-only; assigned by the system on create.
                latitude:
                    example: 33.9976884
                    format: double
                    type: number
                    description: Latitude in decimal degrees. Optional; populated only when the address is geocoded.
                longitude:
                    example: -117.8144595
                    format: double
                    type: number
                    description: Longitude in decimal degrees. Optional; populated only when the address is geocoded.
                name:
                    example: Alessio Antonio Rendina
                    type: string
                    description: Recipient name attached to the address.
                phoneNumber:
                    example: (123) 456 7890
                    type: string
                    description: Contact phone number associated with the address.
                regionISOCode:
                    example: CA
                    type: string
                    description: Region ISO 3166-2 code (for example, CA, MI). Required when the country uses regions.
                street1:
                    example: 1400 Montefino Ave
                    type: string
                    description: First street line.
                street2:
                    example: 1st floor
                    type: string
                    description: Second street line, when supplied.
                street3:
                    example: suite 200
                    type: string
                    description: Third street line, when supplied.
                type:
                    example: 1
                    format: int32
                    maximum: 3
                    minimum: 1
                    type: integer
                    description: Integer address purpose -- 1=BILLING, 2=BILLING_AND_SHIPPING, 3=SHIPPING. Sourced from CommerceAddressConstants.
                zip:
                    example: "91765"
                    type: string
                    description: Postal code or ZIP.
            required:
            - city
            - countryISOCode
            - name
            - street1
            type: object
            description: Billing, shipping, or combined-purpose address owned by an Account. Marking an address as default
                billing or shipping clears the previously default address on the same account.
        AccountChannelEntry:
            properties:
                accountExternalReferenceCode:
                    readOnly: true
                    type: string
                    description: Idempotency key for the parent Account; read-only on this schema.
                accountId:
                    format: int64
                    readOnly: true
                    type: integer
                    description: Reference to the Account entity (FK); read-only on this schema.
                actions:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    readOnly: true
                    type: object
                    description: Map of HATEOAS actions available to the current user, keyed by action name. Each value carries
                        the href template and HTTP method, computed dynamically from user permissions. Read-only.
                channelExternalReferenceCode:
                    type: string
                    description: External reference code of the Channel being overridden.
                channelId:
                    format: int64
                    type: integer
                    description: Reference to the Channel entity (FK) being overridden.
                classExternalReferenceCode:
                    type: string
                    description: External reference code of the target entity (currency, term, discount, etc.) being attached
                        to the channel-account pair.
                classPK:
                    format: int64
                    type: integer
                    description: Internal primary key of the target entity being attached. Read in conjunction with the implicit
                        type derived from the endpoint URL.
                id:
                    format: int64
                    readOnly: true
                    type: integer
                    description: Internal primary key. Read-only; assigned by the system on create.
                overrideEligibility:
                    type: boolean
                    description: Whether this override bypasses channel-level eligibility checks. When true the rule is applied
                        to the account regardless of channel-level filters.
                priority:
                    format: double
                    type: number
                    description: Sort priority among overrides of the same type for the same account. Lower values are applied
                        first.
            type: object
            description: Deprecated -- per-account override of a channel-level commerce rule (currency, delivery or payment
                term, discount, payment method, price list, reserved billing or shipping address, or assigned user). New integrations
                should use the AccountChannelShippingOption schema or nested account sub-resources.
            deprecated: true
        AccountChannelShippingOption:
            properties:
                accountExternalReferenceCode:
                    example: UAB-34098-789-N
                    type: string
                    description: Idempotency key for the parent Account; read-only on this schema.
                accountId:
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                    description: Reference to the Account entity (FK).
                actions:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    readOnly: true
                    type: object
                    description: Map of HATEOAS actions available to the current user, keyed by action name. Each value carries
                        the href template and HTTP method, computed dynamically from user permissions. Read-only.
                channelExternalReferenceCode:
                    type: string
                    description: External reference code of the Channel on which this shipping option applies.
                channelId:
                    format: int64
                    type: integer
                    description: Reference to the Channel entity (FK).
                id:
                    example: 30324
                    format: int64
                    minimum: 0
                    type: integer
                    description: Internal primary key. Read-only; assigned by the system on create.
                shippingMethodId:
                    example: 30324
                    format: int64
                    minimum: 0
                    type: integer
                    description: Reference to the CommerceShippingMethod entity (FK).
                shippingMethodKey:
                    type: string
                    description: Engine key of the shipping method (for example, fixed, by-weight).
                shippingOptionId:
                    example: 30324
                    format: int64
                    minimum: 0
                    type: integer
                    description: Reference to the CommerceShippingFixedOption entity (FK). Used when the shipping method has
                        fixed options.
                shippingOptionKey:
                    type: string
                    description: Engine key of the shipping fixed option, when applicable.
            type: object
            description: Per-account override of a shipping option on a commerce channel. Pairs the account, the channel,
                a shipping method, and a specific fixed option key.
        AccountMember:
            properties:
                accountId:
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                    description: Reference to the Account entity (FK). Read-only on this schema.
                accountRoles:
                    example:
                    -   description:
                            en_US: Account Administrator Description US
                            hr_HR: Account Administrator Description HR
                            hu_HU: Account Administrator Description HU
                    -   description:
                            en_US: Order Manager Description US
                            hr_HR: Order Manager Description HR
                            hu_HU: Order Manager Description HU
                    items:
                        $ref: "#/components/schemas/AccountRole"
                    type: array
                    description: AccountRoles assigned to the user on this account. On PATCH the supplied list fully replaces
                        the user's previous role set; roles not present are removed.
                email:
                    example: joe.1@commerce.com
                    type: string
                    description: Email address of the user being attached as a member.
                externalReferenceCode:
                    example: AB-34098-789-N
                    type: string
                    description: Idempotency key for the User on whom the membership is created.
                name:
                    example: User Name
                    type: string
                    description: Display name of the user being attached as a member.
                userExternalReferenceCode:
                    example: UAB-34098-789-N
                    type: string
                    description: External reference code of the User attached as a member. Alternative to userId on POST.
                userId:
                    example: 30002
                    format: int64
                    minimum: 0
                    type: integer
                    description: Reference to the User entity (FK).
            required:
            - email
            type: object
            description: Membership relation between an Account and a User. Carries the user's account-scoped AccountRoles.
                Updating a member replaces the entire role set on the account.
        AccountOrganization:
            properties:
                accountId:
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                    description: Reference to the Account entity (FK).
                name:
                    example: Organization Name
                    type: string
                    description: Display name of the linked Organization. Read-only; mirrored from the Organization entity.
                organizationExternalReferenceCode:
                    example: UAB-34098-789-N
                    type: string
                    description: External reference code of the linked Organization. Alternative to organizationId on POST.
                organizationId:
                    example: 30002
                    format: int64
                    minimum: 0
                    type: integer
                    description: Reference to the Liferay Organization entity (FK).
                treePath:
                    example: /Parent Organization/Organization Name
                    type: string
                    description: Slash-delimited path from the root of the organization tree to the linked Organization. Read-only.
            type: object
            description: Link between an Account and a Liferay Organization. Used to mirror an organizational hierarchy into
                the commerce domain.
        AccountRole:
            properties:
                description:
                    additionalProperties:
                        type: string
                    example:
                        en_US: Role Description US
                        hr_HR: Role Description HR
                        hu_HU: Role Description HU
                    type: object
                    description: Localized description of the role. Map keys are locale codes (for example, en_US, it_IT);
                        values are the translated strings.
                name:
                    example: Role Name
                    type: string
                    description: Internal name of the role (for example, Account Administrator).
                roleId:
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                    description: Reference to the Liferay Role entity (FK).
                title:
                    additionalProperties:
                        type: string
                    example:
                        en_US: Role Title US
                        hr_HR: Role Title HR
                        hu_HU: Role Title HU
                    type: object
                    description: Localized title of the role. Map keys are locale codes (for example, en_US, it_IT); values
                        are the translated strings.
            required:
            - name
            type: object
            description: Account-scoped Liferay Role assigned to a user through their AccountMember. Carries the localized
                title and description that surface in the back-office.
        AdminAccountGroup:
            properties:
                customFields:
                    additionalProperties: true
                    type: object
                    description: Free-form custom field map declared against the AccountGroup entity.
                description:
                    example: AdminAccountGroup Description
                    type: string
                    description: Display description of the AccountGroup.
                externalReferenceCode:
                    example: AB-34098-789-N
                    type: string
                    description: Idempotency key for create and update; must be unique per AccountGroup within the company.
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                    description: Internal primary key. Read-only; assigned by the system on create.
                name:
                    example: AdminAccountGroup Name
                    type: string
                    description: Display name of the AccountGroup.
            required:
            - name
            type: object
            description: Collection of Accounts that share commerce rules, price lists, or discounts. Corresponds to the standard
                Liferay AccountGroup entity; the AdminAccountGroup name is preserved to avoid colliding with the AccountGroup
                schema in com.liferay.headless.admin.user.
        Error:
            properties:
                errorCode:
                    description: Internal numeric error code, distinct from the HTTP status. Mapped from the Liferay exception
                        that produced the response. Read-only.
                    example: 996
                    readOnly: true
                    type: integer
                errorDescription:
                    example: Unable to find currency. Currency code should be expressed with 3-letter ISO 4217 format.
                    readOnly: true
                    type: string
                    description: Human-readable description of the error suitable for surfacing to operators. Read-only.
                message:
                    example: No CommerceCurrency exists with the key {groupId=41811, code=US Dollar}
                    readOnly: true
                    type: string
                    description: Underlying exception message, often including the lookup keys that failed. Read-only.
                status:
                    description: HTTP status code returned with this error envelope. Read-only.
                    example: 404
                    readOnly: true
                    type: integer
            required:
            - errorCode
            - errorDescription
            - message
            - status
            type: object
            description: Standard error envelope returned by every non-success response. Carries the HTTP status, an internal
                error code, and a human-readable description.
        User:
            properties:
                email:
                    example: joe.1@commerce.com
                    type: string
                    description: Primary email address. Used as the login when the portal is configured to log in by email.
                externalReferenceCode:
                    example: AB-34098-789-N
                    type: string
                    description: Idempotency key for create and update; must be unique per User within the company.
                firstName:
                    type: string
                    description: Given name.
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                    description: Internal primary key. Read-only; assigned by the system on create.
                jobTitle:
                    type: string
                    description: Free-form job title displayed in the back-office.
                lastName:
                    type: string
                    description: Family name.
                male:
                    example: true
                    type: boolean
                    description: Whether the user is recorded as male in the profile. Legacy field; new integrations should
                        not rely on it.
                middleName:
                    type: string
                    description: Middle name, when supplied.
                roles:
                    items:
                        type: string
                    type: array
                    description: Names of the regular (portal-scoped) Liferay roles to assign to the user.
            required:
            - email
            - firstName
            - lastName
            type: object
            description: Liferay user account. Returned by the createUser endpoint when a new user is provisioned as part
                of an Account membership invitation.
        body:
            properties:
                logo:
                    format: binary
                    type: string
                    description: Binary image file uploaded as the Account logo. Standard image formats (PNG, JPEG, GIF) are
                        accepted.
            type: object
            description: Multipart upload envelope for an Account logo. Contains a single binary file field named logo.
        body_1:
            properties:
                logo:
                    format: binary
                    type: string
                    description: Binary image file uploaded as the Account logo. Standard image formats (PNG, JPEG, GIF) are
                        accepted.
            type: object
            description: Multipart upload envelope for an Account logo addressed by external reference code. Contains a single
                binary file field named logo.
    securitySchemes:
        BasicAuth:
            scheme: basic
            type: http
        BearerAuth:
            scheme: bearer
            type: http
        OAuth2:
            flows:
                authorizationCode:
                    authorizationUrl: /oauth/authorize
                    scopes:
                        CommerceOpenApiAdmin.admin: Grants access to admin operations
                        CommerceOpenApiAdmin.read: Grants read access
                        CommerceOpenApiAdmin.write: Grants write access
                    tokenUrl: /oauth/token
            type: oauth2
info:
    contact:
        email: team-commerce@liferay.com
        name: Commerce Team
    description:
        "Liferay Commerce Admin Account API. Manages B2B and B2C Commerce accounts and their relationships from the
        admin perspective. -- Primary entities -- Account (the commerce buyer organization), AccountGroup (collections
        of accounts that share rules), AccountMember (links users to accounts with account-scoped roles),
        AccountOrganization (links accounts to Liferay Organizations), AccountAddress (billing and shipping addresses),
        AccountChannelEntry (deprecated per-account overrides of channel-level rules including currency, delivery and
        payment terms, discounts, payment methods, price lists, and reserved shipping or billing addresses), and
        AccountChannelShippingOption (per-account overrides of available shipping methods on a channel). -- Perspective
        -- administrators with the CommerceOpenApiAdmin.read or CommerceOpenApiAdmin.write scope. Endpoints expose the
        full account graph, including HATEOAS action descriptors and custom fields, regardless of the requesting user's
        account membership. -- Related modules -- buyer-perspective endpoints live in
        com.liferay.headless.commerce.delivery.cart and com.liferay.headless.commerce.delivery.catalog. Channel and
        pricing configuration lives in com.liferay.headless.commerce.admin.channel and
        com.liferay.headless.commerce.admin.pricing. -- Common workflows -- (1) Provision an account, addresses, and
        members from the back-office. POST /accounts with externalReferenceCode upserts the account; nested addresses
        and members are persisted in the same call. Add further memberships through POST
        /accounts/by-externalReferenceCode/<externalReferenceCode>/accountMembers (existing user) or
        .../accountMembers/createUser (new user). (2) Link an existing user as an account member. POST
        /accounts/by-externalReferenceCode/<externalReferenceCode>/accountMembers with userId or
        userExternalReferenceCode and the desired AccountRoles. PATCH on the member endpoint replaces the user's role
        set on the account. (3) Override channel-level rules for one account. POST /accounts/<id>/account-channel-* (or
        the by-externalReferenceCode variant) creates an override that takes precedence over the channel default. The
        top-level /account-channel-* endpoints are deprecated -- prefer the nested forms scoped under an account. (4)
        Group accounts for bulk rule application. POST /accountGroups creates the group (upsert by
        externalReferenceCode); POST /accountGroups/by-externalReferenceCode/<externalReferenceCode>/accounts links an
        account into the group, and the DELETE counterpart unlinks it. A Java client JAR is available for use with the
        group ID 'com.liferay', artifact ID 'com.liferay.headless.commerce.admin.account.client', and version '4.0.43'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Liferay Commerce Admin Account API
    version: v1.0
openapi: 3.0.0
paths:
    /account-channel-billing-addresses/{id}:
        delete:
            deprecated: true
            parameters:
            -   $ref: "#/components/parameters/idPathParam"
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
                    description: Updated
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description: Authentication information is missing or invalid
                403:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description: The authenticated user lacks permission for the requested action on this resource.
            security:
            -   BasicAuth: []
            -   BearerAuth: []
            -   OAuth2:
                - CommerceOpenApiAdmin.write
            summary: Deletes account channel billing address.
            tags:
            - AccountChannelEntry
            description: Deprecated -- deletes the per-account billing address channel override identified by its internal
                ID. Calls CommerceChannelAccountEntryRelService.deleteCommerceChannelAccountEntryRel for type TYPE_BILLING_ADDRESS.
                Returns 204 on success. Prefer the channel-shipping-option or account-scoped successor endpoints for new integrations.
        get:
            deprecated: true
            parameters:
            -   $ref: "#/components/parameters/idPathParam"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AccountChannelEntry"
