tags:
    -   description:
            Discount programs scoped to a company. Each discount carries a target (subtotal, total, products,
            categories, skus, product-groups, or shipping), a limitation policy (unlimited, limited,
            limited-for-accounts, limited-for-accounts-and-total), and a percentage or fixed-amount payout, and may be
            gated by an optional couponCode.
        name: Discount
    -   description:
            Account-group bindings that restrict a discount's eligibility to a specific set of AccountGroups. Backed by
            CommerceDiscountCommerceAccountGroupRel.
        name: DiscountAccountGroup
    -   description:
            Category bindings that restrict a discount to products tagged with specific asset categories. Backed by
            CommerceDiscountRel with the AssetCategory class name.
        name: DiscountCategory
    -   description:
            Product bindings that restrict a discount to specific products. Backed by CommerceDiscountRel with the
            CPDefinition class name.
        name: DiscountProduct
    -   description:
            Pre-qualification, post-qualification, or target validators attached to a discount. Each rule carries a type
            string and a JSON typeSettings payload interpreted by the matching CommerceDiscountRuleType.
        name: DiscountRule
    -   description:
            Per-SKU price entries inside a price list. Each entry binds a SKU (CPInstance) to a regular price and an
            optional promo price; entries with quantity-break overrides expose `hasTierPrice`.
        name: PriceEntry
    -   description:
            Versioned price catalogs that price SKUs in a specific currency for a CommerceCatalog. Each price list has a
            priority, a display/expiration window, and may be account-group-scoped.
        name: PriceList
    -   description:
            Account-group bindings that restrict a price list's eligibility to a specific set of AccountGroups, with an
            `order` integer that controls the resolution priority.
        name: PriceListAccountGroup
    -   description:
            Quantity-break overrides on a price entry. Each tier price binds a minimumQuantity threshold to an override
            price (and an optional promo price) that supersedes the parent price entry above that quantity.
        name: TierPrice