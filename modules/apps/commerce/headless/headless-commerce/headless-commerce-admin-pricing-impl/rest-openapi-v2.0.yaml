paths:
    /discount-account-groups/{discountAccountGroupId}:
        delete:
            description:
                Deletes the CommerceDiscountCommerceAccountGroupRel addressed by internal id via
                CommerceDiscountCommerceAccountGroupRelService.
            operationId: deleteDiscountAccountGroup
            parameters:
                -   $ref: "#/components/parameters/discountAccountGroupIdPathParam"
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Authentication information is missing or invalid
                403:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The authenticated user lacks permission for the requested action on this resource.
            security:
                -   BasicAuth: []
                -   BearerAuth: []
                -   OAuth2:
                        -   HeadlessCommerceAdminPricing.write
            summary: Deletes a Discount Account Group by ID.
            tags: ["DiscountAccountGroup"]
    /discount-account-groups/{discountAccountGroupId}/account-group:
        get:
            description:
                Returns the PricingAccountGroup nested in a DiscountAccountGroup (via
                CommerceDiscountCommerceAccountGroupRel) addressed by internal rel id.
            operationId: getDiscountAccountGroupAccountGroup
            parameters:
                -   $ref: "#/components/parameters/discountAccountGroupIdPathParam"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PricingAccountGroup"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/PricingAccountGroup"
                    description:
                        Successful operation
                400:
                    description:
                        Invalid input
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Authentication information is missing or invalid
                403:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The authenticated user lacks permission for the requested action on this resource.
                404:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The specified resource was not found
                500:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Unexpected error
            security:
                -   BasicAuth: []
                -   BearerAuth: []
                -   OAuth2:
                        -   HeadlessCommerceAdminPricing.read
            summary: Gets account group associated to the pricing object.
            tags: ["PricingAccountGroup"]
    /discount-accounts/{discountAccountId}:
        delete:
            description:
                Deletes the CommerceDiscountAccountRel addressed by internal id via CommerceDiscountAccountRelService.
                Throws NoSuchDiscountException when relation id is unknown.
            operationId: deleteDiscountAccount
            parameters:
                -   $ref: "#/components/parameters/discountAccountIdPathParam"
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Authentication information is missing or invalid
                403:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The authenticated user lacks permission for the requested action on this resource.
            security:
                -   BasicAuth: []
                -   BearerAuth: []
                -   OAuth2:
                        -   HeadlessCommerceAdminPricing.write
            summary: Deletes a Discount Account by ID.
            tags: ["DiscountAccount"]
    /discount-accounts/{discountAccountId}/account:
        get:
            description:
                Returns the Account nested in a DiscountAccount (via CommerceDiscountAccountRel) addressed by internal
                rel id.
            operationId: getDiscountAccountAccount
            parameters:
                -   $ref: "#/components/parameters/discountAccountIdPathParam"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Account"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Account"
                    description:
                        Successful operation
                400:
                    description:
                        Invalid input
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Authentication information is missing or invalid
                403:
                    content:
                        application/json:
