tags:
    -   description:
            Read-only lookups of Account records referenced by other pricing resources -- exposed so a client that
            holds a discount or price-list account binding can resolve the linked account without leaving the pricing
            module.
        name: Account
    -   description:
            Read-only lookups of AssetCategory records referenced by discount and price-modifier category bindings.
        name: Category
    -   description:
            Read-only lookups of CommerceChannel records referenced by discount and price-list channel bindings.
        name: Channel
    -   description:
            Promotional discount programs scoped to a company. Each discount carries a target (subtotal, total,
            products, categories, skus, product-groups, or shipping), a limitation policy (unlimited, limited,
            limited-for-accounts, limited-for-accounts-and-total), a percentage or fixed-amount payout, and may be
            gated by an optional couponCode. Backed by CommerceDiscount.
        name: Discount
    -   description:
            Account bindings that restrict a discount's eligibility to a specific set of Accounts. Backed by
            CommerceDiscountCommerceAccountRel.
        name: DiscountAccount
    -   description:
            Account-group bindings that restrict a discount's eligibility to a specific set of AccountGroups. Backed
            by CommerceDiscountCommerceAccountGroupRel.
        name: DiscountAccountGroup
    -   description:
            Category bindings that restrict a discount to products tagged with specific asset categories. Backed by
            CommerceDiscountRel with the AssetCategory class name.
        name: DiscountCategory
    -   description:
            Channel bindings that restrict a discount's eligibility to a specific set of CommerceChannels. Backed by
            CommerceDiscountCommerceChannelRel.
        name: DiscountChannel
    -   description:
            CommerceOrderType bindings that restrict a discount's eligibility to specific order types. Backed by
            CommerceDiscountCommerceOrderTypeRel.
        name: DiscountOrderType
    -   description:
            Product bindings that restrict a discount to specific products. Backed by CommerceDiscountRel with the
            CPDefinition class name.
        name: DiscountProduct
    -   description:
            CommerceProductGroup bindings that restrict a discount to products inside a product group. Backed by
            CommerceDiscountCommerceProductGroupRel.
        name: DiscountProductGroup
    -   description:
            Pre-qualification, post-qualification, or target validators attached to a discount. Each rule carries a
            type string and a JSON typeSettings payload interpreted by the matching CommerceDiscountRuleType.
        name: DiscountRule
    -   description:
            SKU bindings that restrict a discount to specific CPInstances. Backed by CommerceDiscountRel with the
            CPInstance class name.
        name: DiscountSku
    -   description:
            Read-only lookups of CommerceOrderType records referenced by discount and price-list order-type bindings.
        name: OrderType
    -   description:
            Per-SKU price entries inside a price list. Each entry binds a SKU (CPInstance) to a regular price and an
            optional promo price; entries with quantity-break overrides expose `hasTierPrice`.
        name: PriceEntry
    -   description:
            Versioned price catalogs that price SKUs in a specific currency for a CommerceCatalog. Each price list has
            a priority, a display/expiration window, and may be scoped to specific accounts, account-groups, channels,
            or order types.
        name: PriceList
    -   description:
            Account bindings that restrict a price list's eligibility to a specific set of Accounts. Backed by
            CommercePriceListCommerceAccountRel.
        name: PriceListAccount
    -   description:
            Account-group bindings that restrict a price list's eligibility to a specific set of AccountGroups, with
            an `order` integer that controls the resolution priority.
        name: PriceListAccountGroup
    -   description:
            Channel bindings that restrict a price list's eligibility to a specific set of CommerceChannels. Backed by
            CommercePriceListCommerceChannelRel.
        name: PriceListChannel
    -   description:
            Discount linkages attached to a price list. Each binding ties one CommerceDiscount to the price list so
            its rules participate in price resolution against that list. Backed by
            CommercePriceListCommerceDiscountRel.
        name: PriceListDiscount
    -   description:
            CommerceOrderType bindings that restrict a price list's eligibility to specific order types. Backed by
            CommercePriceListCommerceOrderTypeRel.
        name: PriceListOrderType
    -   description:
            Add-on price calculations layered on a price list. Each modifier carries a target (categories, products,
            or product-groups), a modifierAmount or modifierPercentage, a modifierType (absolute or percentage), a
            limitationType, and a priority. Backed by CommercePriceModifier.
        name: PriceModifier
    -   description:
            AssetCategory bindings that restrict a price modifier to products tagged with specific asset categories.
            Backed by CommercePriceModifierRel with the AssetCategory class name.
        name: PriceModifierCategory
    -   description:
            CPDefinition bindings that restrict a price modifier to specific products. Backed by
            CommercePriceModifierRel with the CPDefinition class name.
        name: PriceModifierProduct
    -   description:
            CommerceProductGroup bindings that restrict a price modifier to products inside a product group. Backed by
            CommercePriceModifierRel with the CommerceProductGroup class name.
        name: PriceModifierProductGroup
    -   description:
            Read-only lookups of CommerceAccountGroup records referenced by discount and price-list account-group
            bindings.
        name: PricingAccountGroup
    -   description:
            Read-only lookups of CPDefinition records referenced by discount and price-modifier product bindings.
        name: Product
    -   description:
            Read-only lookups of CommerceProductGroup records referenced by discount and price-modifier product-group
            bindings.
        name: ProductGroup
    -   description:
            Read-only lookups of CPInstance (SKU) records referenced by discount sku bindings and by price entries.
        name: Sku
    -   description:
            Quantity-break overrides on a price entry. Each tier price binds a minimumQuantity threshold to an
            override price; the runtime resolves the highest-quantity tier whose minimumQuantity is at most the cart
            line quantity.
        name: TierPrice