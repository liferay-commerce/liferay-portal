                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    readOnly: true
                    type: object
                discountAccountGroupId:
                    description:
                        Reference to the discountAccountGroup entity (FK identifier).
                    example: 30643
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                discountExternalReferenceCode:
                    description:
                        String value of `discountExternalReferenceCode`.
                    example: DAB-34098-789-N
                    type: string
                discountId:
                    description:
                        Reference to the discount entity (FK identifier).
                    example: 30324
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
            required:
                -   accountGroupId
            type: object
        DiscountCategory:
