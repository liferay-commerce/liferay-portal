                    minimum: 0
                    type: integer
                modifierAmount:
                    description:
                        Absolute add-on amount the modifier contributes. Mutually exclusive with modifierPercentage;
                        meaningful when modifierType is absolute.
                    example: 25
                    format: bigdecimal
                    type: number
                modifierType:
                    description:
                        Calculation kind for the modifier. One of `absolute` (modifierAmount used) or `percentage`
