                    format: date
                    type: string
                expirationDate:
                    description:
                        Date when this record expires. ISO 8601; the runtime stops honoring it past this date.
                    example: 2017-08-21
                    format: date
                    type: string
                externalReferenceCode:
                    description:
                        Idempotency key for create and update; must be unique within the company.
                    example: AB-34098-789-N
                    type: string
                id:
