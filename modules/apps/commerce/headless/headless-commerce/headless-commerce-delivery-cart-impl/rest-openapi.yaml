tags:
-   description:
        Billing and shipping addresses (CommerceAddress) attached to a cart, exposed as nested read-only views off the
        parent cart.
    name: Address
-   description:
        File attachments (CommerceOrderAttachment) uploaded against a cart -- invoices, signed quotes, spec sheets, and
        similar buyer-facing documents.
    name: Attachment
-   description:
        Top-level shopping cart (CommerceOrder while in ORDER_STATUS_OPEN). Carries items, addresses, applied coupon,
        terms, and the workflow status that moves it to checkout.
    name: Cart
-   description:
        Buyer or staff notes (CommerceOrderNote) attached to a cart. Restricted notes are visible only to users with
        MANAGE_COMMERCE_ORDER_NOTES.
    name: CartComment
-   description:
        Cart line items (CommerceOrderItem). Each item binds a purchasable SKU and quantity, with unit pricing, options,
        settings, and optional per-item shipping address.
    name: CartItem
-   description:
        Workflow and status transitions available on a cart, including request-quote, submit, quick-checkout, checkout,
        and any active workflow task transitions.
    name: CartTransition
-   description:
        Read-only enumeration of payment methods (CommercePaymentMethodGroupRel) qualified for the cart's billing
        address, order type, and subscription eligibility.
    name: PaymentMethod
-   description:
        Read-only enumeration of shipping methods (CommerceShippingMethod) qualified for the cart's shipping address
        country, with computed shipping options.
    name: ShippingMethod
-   description:
        Delivery and payment terms (CommerceTermEntry) qualified for the cart's order type and the currently selected
        shipping or payment method.
    name: Term