tags:
    -   description:
            Fulfillment record for a CommerceOrder. Owns the carrier, tracking data, ship dates, and the workflow
            transitions that advance a shipment from PROCESSING to DELIVERED.
        name: Shipment
    -   description:
            Picked line on a CommerceShipment. Binds a CommerceOrderItem to a CommerceShipment with a quantity drawn
            from a specific CommerceInventoryWarehouse.
        name: ShipmentItem
    -   description:
            Postal ship-to address attached to a CommerceShipment. Mirrors the underlying CommerceAddress and is
            resolvable by country and region ISO codes.
        name: ShippingAddress
