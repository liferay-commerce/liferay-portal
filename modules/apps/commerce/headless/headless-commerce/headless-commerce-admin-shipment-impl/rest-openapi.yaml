components:
    parameters:
        externalReferenceCodePathParam:
            in: path
            description:
                External reference code that addresses the target resource on the `by-externalReferenceCode` paths. The
                code is the integration-supplied idempotency key, unique within the resource scope; PUT against this
                path is upsert (create when absent, replace when present).
            explode: false
            name: externalReferenceCode
            required: true
            schema:
                description:
                    The resource external reference code
                example: AB-34098-789-N
                minLength: 1
                type: string
            style: simple
        filterQueryParam:
            in: query
            description:
                OData v4 filter expression that narrows the result set. The supported fields are those exposed by the
                matching Liferay entity model for CommerceShipment (typically createDate, modifiedDate, status, and the
                shipment identifiers). Example -- filter=status eq 2.
            explode: true
            name: filter
            required: false
            schema:
                type: string
            style: form
        pageQueryParam:
            in: query
            description:
                One-based page index. Combined with pageSize to paginate the result set; defaults to 1 when omitted.
            explode: true
            name: page
            required: false
            schema:
                type: integer
            style: form
        pageSizeQueryParam:
            in: query
            description:
                Number of items per page. Defaults to the portal's configured page size when omitted; capped by the
                portal configuration to prevent unbounded reads.
            explode: true
            name: pageSize
            required: false
            schema:
                type: integer
            style: form
        searchQueryParam:
            in: query
            description:
                Full-text search expression matched against the resource's indexed fields. Returns the items whose
                searchable content matches the expression.
            explode: true
            name: search
            required: false
            schema:
                type: string
            style: form
        shipmentIdPathParam:
            in: path
            description:
                Internal numeric identifier of the target CommerceShipment. Counterpart to the
                `by-externalReferenceCode` path variant; identifiers are server-assigned and stable across the
                shipment's lifetime.
            explode: false
            name: shipmentId
            required: true
            schema:
                description:
                    The shipment resource Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
        shipmentItemIdPathParam:
            in: path
            description:
                Internal numeric identifier of the target CommerceShipmentItem. Identifiers are server-assigned and
                stable across the shipment item's lifetime; the parent shipment is resolved from the row.
            explode: false
            name: shipmentItemId
            required: true
            schema:
                description:
                    The shipment item resource Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
        sortQueryParam:
            in: query
            description:
                Sort expression of the form `field:asc` or `field:desc`, comma-separated for multi-field sorting.
                Supported sort fields depend on the endpoint and are sourced from the matching entity model (typically
                createDate, modifiedDate, and the status field).
            explode: true
            name: sort
            required: false
            schema:
                type: string
            style: form
    schemas:
        Error:
            description:
                Standard error envelope returned with every non-success HTTP status. Carries the HTTP status, an
                internal error code, a human-readable message, and a developer-oriented description.
            properties:
                errorCode:
                    description:
                        Internal error code mapping used by tooling to group related failures. Read-only.
                    example: 996
                    readOnly: true
                    type: integer
                errorDescription:
                    description:
                        Developer-oriented diagnostic message describing the failure. Suitable for logging and
                        debugging; not intended for end-user display. Read-only.
                    example: Unable to find currency. Currency code should be expressed with 3-letter ISO 4217 format.
                    readOnly: true
                    type: string
                message:
                    description:
                        Short human-readable summary of the failure. Suitable for end-user display when the surrounding
                        UI does not provide a domain-specific message. Read-only.
                    example: No CommerceCurrency exists with the key {groupId=41811, code=US Dollar}
                    readOnly: true
                    type: string
                status:
                    description:
                        HTTP status code returned with the response (mirrors the response status line). Read-only.
                    example: 404
                    readOnly: true
                    type: integer
            required:
                -   errorCode
                -   errorDescription
                -   message
                -   status
            type: object
        Shipment:
            description:
                Fulfillment record for a CommerceOrder. Carries the carrier, tracking, expected and shipping dates, the
                shipping address, the picked items (CommerceShipmentItem rows), and the workflow status that advances
                from PROCESSING through READY_TO_BE_SHIPPED and SHIPPED to DELIVERED.
            properties:
                accountId:
                    description:
                        Reference to the CommerceAccount that owns the source order (FK). Copied from the order on
                        create and read-only thereafter.
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                actions:
                    description:
                        Map of HATEOAS actions available to the current user, keyed by action name (typically delete,
                        get, update). Each value carries the href template and HTTP method, computed dynamically from
                        the user's permissions on the shipment. Read-only.
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    readOnly: true
                    type: object
                carrier:
                    description:
                        Name of the shipping carrier handling the parcel (for example, FedEx, UPS, DHL). Free-form
                        string set by the fulfillment operator.
                    example: FedEx
                    type: string
                createDate:
                    description:
                        Timestamp when the shipment row was created. Read-only.
                    format: date
                    readOnly: true
                    type: string
                customFields:
                    description:
                        Portal Expando custom field values attached to the CommerceShipment, expressed as a flat list
                        of name/value entries. The fields and their value types are declared on the
                        CommerceShipment.class custom-fields configuration.
                    items:
                        type: customField
                    type: array
                expectedDate:
                    description:
                        Date on which the parcel is expected to arrive at the customer. Supplied by the fulfillment
                        operator; updatable until the shipment reaches DELIVERED status.
                    format: date
                    type: string
                externalReferenceCode:
                    description:
                        Idempotency key for create and update; must be unique per shipment within the company. When
                        set, the resource is also addressable through the `/shipments/by-externalReferenceCode/...`
                        paths.
                    type: string
                id:
                    description:
                        Server-assigned identifier of the CommerceShipment (commerceShipmentId). Stable across the
                        shipment's lifetime. Read-only.
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                modifiedDate:
                    description:
                        Timestamp of the most recent update to the shipment row. Read-only.
                    format: date
                    readOnly: true
                    type: string
                orderExternalReferenceCode:
                    description:
                        External reference code of the CommerceOrder this shipment fulfills. Accepted on create as an
                        alternative to orderId; the order is resolved against the current company scope. Not returned
                        on read; the shipment carries the resolved orderId and accountId instead.
                    example: AB-34098-789-N
                    type: string
                orderId:
                    description:
                        Identifier of the CommerceOrder this shipment fulfills (FK). Required on create unless
                        orderExternalReferenceCode is supplied; used to seed the shipment's groupId, accountId,
                        shippingAddressId, shippingMethodId, and shippingOptionName.
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                shipmentItems:
                    description:
                        Nested list of CommerceShipmentItem rows to write together with the shipment. When supplied on
                        update, every existing shipment item on the parent shipment is deleted first and the array is
                        replayed; supply an empty array to clear all items, or omit the field to leave items untouched.
                    items:
                        $ref: "#/components/schemas/ShipmentItem"
                    type: array
                shippingAddress:
                    description:
                        Nested ShippingAddress applied to this shipment. When supplied, the existing CommerceAddress is
                        updated in place (or a new one is created when none is linked yet) and the shipment is rebound
                        to it. Omit to leave the address inherited from the source order.
                    $ref: "#/components/schemas/ShippingAddress"
                shippingAddressId:
                    description:
                        Identifier of the CommerceAddress the parcel is shipped to (FK). Copied from the source order
                        on create; can be retargeted in flight by supplying a nested shippingAddress or by calling the
                        shipping-address endpoint.
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                shippingDate:
                    description:
                        Date on which the parcel was handed over to the carrier. Typically set when the shipment
                        transitions to SHIPPED.
                    format: date
                    type: string
                shippingMethodId:
                    description:
                        Identifier of the CommerceShippingMethod used by the carrier (FK). Copied from the source
                        order on create; updatable while the shipment is still in PROCESSING or READY_TO_BE_SHIPPED.
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                shippingOptionName:
                    description:
                        Label of the shipping option selected on the source order (for example, Standard Delivery,
                        Express). Copied from the order on create. Read-only.
                    example: Standard Delivery
                    readOnly: true
                    type: string
                status:
                    description:
                        Workflow state of the shipment, exposed as a Status envelope with the integer `code` and its
                        human-readable label. The code values are 0=PROCESSING, 1=READY_TO_BE_SHIPPED, 2=SHIPPED,
                        3=DELIVERED; transitions are driven by the status-* POST endpoints. Read-only on this schema.
                    $ref: "#/components/schemas/Status"
                    readOnly: true
                trackingNumber:
                    description:
                        Carrier-assigned tracking number for the parcel. Free-form string set by the fulfillment
                        operator.
                    example: 123AD-asd
                    type: string
                trackingURL:
                    description:
                        URL of the carrier tracking page for this parcel. Free-form string; not validated as a URL.
                    example: https://example.com/track?number=123AD-asd
                    type: string
                userName:
                    description:
                        Display name of the user who created the shipment. Read-only.
                    example: John
                    readOnly: true
                    type: string
            type: object
        ShipmentItem:
            description:
                Single picked line on a CommerceShipment. Binds a CommerceOrderItem to a CommerceShipment with a
                quantity drawn from a specific CommerceInventoryWarehouse, optionally validating against stock on hand.
            properties:
                actions:
                    description:
                        Map of HATEOAS actions available to the current user, keyed by action name (typically delete,
                        get, update). Each value carries the href template and HTTP method, computed dynamically from
                        the user's permissions on the shipment item. Read-only.
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    readOnly: true
                    type: object
                createDate:
                    description:
                        Timestamp when the shipment item row was created. Read-only.
                    format: date
                    readOnly: true
                    type: string
                externalReferenceCode:
                    description:
                        Idempotency key for create and update; must be unique per shipment item within the company.
                        When set, the resource is also addressable through the `/shipment-items/by-externalReferenceCode/...`
                        paths.
                    type: string
                id:
                    description:
                        Server-assigned identifier of the CommerceShipmentItem (commerceShipmentItemId). Stable across
                        the row's lifetime. Read-only.
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                modifiedDate:
                    description:
                        Timestamp of the most recent update to the shipment item row. Read-only.
                    format: date
                    readOnly: true
                    type: string
                orderItemExternalReferenceCode:
                    description:
                        External reference code of the CommerceOrderItem this shipment item draws from. Accepted on
                        create as an alternative to orderItemId; the order item is resolved against the current
                        company scope.
                    type: string
                orderItemId:
                    description:
                        Identifier of the CommerceOrderItem this shipment item draws from (FK). Required on create
                        unless orderItemExternalReferenceCode is supplied; identifies the SKU and the remaining
                        quantity available to ship.
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                quantity:
                    description:
                        Quantity shipped on this row, expressed in the unitOfMeasureKey of the referenced order item.
                        Formatted on read by CommerceQuantityFormatter against the SKU's unit-of-measure configuration.
                        Required on create.
                    example: 10.1
                    format: bigdecimal
                    minimum: 0
                    type: number
                shipmentExternalReferenceCode:
                    description:
                        External reference code of the parent CommerceShipment this item belongs to. Read-only; derived
                        from the linked shipment.
                    type: string
                shipmentId:
                    description:
                        Identifier of the parent CommerceShipment this item belongs to (FK). Set by the server when
                        the item is created through a shipment-scoped path. Read-only.
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                unitOfMeasureKey:
                    description:
                        Unit-of-measure key applied to the quantity (for example, each, m, kg). Inherited from the
                        referenced order item.
                    example: s
                    type: string
                userName:
                    description:
                        Display name of the user who created the shipment item. Read-only.
                    example: John
                    readOnly: true
                    type: string
                validateInventory:
                    description:
                        When true, the server validates the requested quantity against the warehouse's current stock
                        on hand and rejects the change when stock is insufficient. Defaults to true when omitted.
                    example: true
                    type: boolean
                warehouseExternalReferenceCode:
                    description:
                        External reference code of the CommerceInventoryWarehouse the item is picked from. Accepted on
                        create as an alternative to warehouseId; the warehouse is resolved against the current company
                        scope.
                    type: string
                warehouseId:
                    description:
                        Identifier of the CommerceInventoryWarehouse the item is picked from (FK). Required on create
                        unless warehouseExternalReferenceCode is supplied. Defaults to the warehouse already bound to
                        the row on update.
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
            required:
                -   quantity
            type: object
        ShippingAddress:
            description:
                Postal address used as the ship-to address on a CommerceShipment. Mirrors the underlying CommerceAddress
                row, scoped to the shipment that owns it. Country and region are resolved by ISO codes against the
                portal's CountryService and RegionService.
            properties:
                city:
                    description:
                        City portion of the address. Required.
                    example: Diamond Bar
                    type: string
                countryISOCode:
                    description:
                        ISO 3166-1 alpha-2 code of the country (for example, US, IT). Resolved against the portal's
                        CountryService to look up the Country row. Required.
                    example: US
                    type: string
                description:
                    description:
                        Free-form delivery notes attached to the address (for example, building or floor hints).
                    example: right stairs, first room on the left
                    type: string
                externalReferenceCode:
                    description:
                        Idempotency key for the underlying CommerceAddress row; must be unique per address within the
                        company.
                    example: AB-34098-789-N
                    type: string
                id:
                    description:
                        Server-assigned identifier of the CommerceAddress (commerceAddressId). Stable across the
                        address's lifetime.
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                latitude:
                    description:
                        Geographic latitude of the address, in decimal degrees. Optional.
                    example: 33.9976884
                    format: double
                    type: number
                longitude:
                    description:
                        Geographic longitude of the address, in decimal degrees. Optional.
                    example: -117.8144595
                    format: double
                    type: number
                name:
                    description:
                        Full name of the recipient on the parcel label. Required.
                    example: Alessio Antonio Rendina
                    type: string
                phoneNumber:
                    description:
                        Recipient phone number, as a free-form string. Optional; not validated.
                    example: (123) 456 7890
                    type: string
                regionISOCode:
                    description:
                        Region/state code as returned by Region.getRegionCode() for the resolved Country (for example,
                        CA for California). Optional.
                    example: CA
                    type: string
                street1:
                    description:
                        First line of the street address (number and street name). Required.
                    example: 1400 Montefino Ave
                    type: string
                street2:
                    description:
                        Second line of the street address (for example, apartment or floor). Optional.
                    example: 1st floor
                    type: string
                street3:
                    description:
                        Third line of the street address (for example, suite or building). Optional.
                    example: suite 200
                    type: string
                zip:
                    description:
                        Postal/ZIP code of the address.
                    example: "91765"
                    type: string
            required:
                -   city
                -   countryISOCode
                -   name
                -   street1
            type: object
        Status:
            description:
                Workflow-status envelope describing the integer code and the localized label of a CommerceShipment.
                Used by the Shipment.status property; values are sourced from CommerceShipmentConstants.
            properties:
                code:
                    description:
                        Integer status of the shipment -- 0=PROCESSING, 1=READY_TO_BE_SHIPPED, 2=SHIPPED, 3=DELIVERED.
                        Transitions are driven by the status-* POST endpoints; the code is not editable directly on
                        the Shipment resource. Read-only.
                    format: int32
                    readOnly: true
                    type: integer
                label:
                    description:
                        Non-localized label corresponding to the code (for example, processing, ready-to-be-shipped,
                        shipped, delivered).
                    example: shipped
                    type: string
                label_i18n:
                    description:
                        Localized label for the code, resolved against the current request's preferred locale.
                    example: Spedito
                    type: string
            type: object
    securitySchemes:
        BasicAuth:
            scheme: basic
            type: http
        BearerAuth:
            scheme: bearer
            type: http
        OAuth2:
            flows:
                authorizationCode:
                    authorizationUrl: /oauth/authorize
                    scopes:
                        CommerceOpenApiAdmin.admin: Grants access to admin operations
                        CommerceOpenApiAdmin.read: Grants read access
                        CommerceOpenApiAdmin.write: Grants write access
                    tokenUrl: /oauth/token
            type: oauth2
info:
    description:
        "Liferay Commerce Admin Shipment REST API. Manages the fulfillment of CommerceOrders -- CommerceShipment
        headers, the CommerceShipmentItem rows that pick stock from a CommerceInventoryWarehouse, the CommerceAddress
        that the parcel ships to, and the workflow that advances a shipment from PROCESSING (0) to READY_TO_BE_SHIPPED
        (1) to SHIPPED (2) to DELIVERED (3). The API targets back-office fulfillment operators and integration tooling;
        storefront-side ordering belongs to the headless-commerce-delivery-order module. Most resources are addressable
        both by internal ID and by external reference code; PUT against the external-reference-code path is upsert
        (create when the ERC is unknown, update otherwise). PATCH applies JSON Merge Patch (only the supplied fields are
        modified). For the order, account, and inventory data that this module refers to see the matching
        headless-commerce-admin-order, headless-commerce-admin-account, and headless-commerce-admin-inventory modules.
        -- Common workflows: Ship an order in one parcel -- (1) POST /shipments with orderId (or
        orderExternalReferenceCode) and an inline shipmentItems array to create the CommerceShipment in PROCESSING
        status and deduct stock from the chosen warehouse; (2) POST /shipments/<shipmentId>/status-finish-processing to
        advance the shipment to READY_TO_BE_SHIPPED once picking is complete; (3) POST
        /shipments/<shipmentId>/status-shipped after the carrier accepts the parcel; (4) POST
        /shipments/<shipmentId>/status-delivered after the customer receives it. -- Partial fulfillment -- (1) POST
        /shipments referencing the order to open an empty shipment; (2) POST /shipments/<shipmentId>/items per
        CommerceOrderItem to add a subset of the ordered quantity, choosing the picking warehouse per row; (3) repeat
        the open-then-add cycle for each subsequent parcel until the remaining order quantity is zero. -- Correct a
        shipment in flight -- (1) PATCH /shipments/<shipmentId> to adjust carrier, trackingNumber, trackingURL,
        expectedDate, shippingDate, or shippingMethodId without changing the line items; (2) PATCH
        /shipments/<shipmentId>/shipping-address to retarget the parcel before it leaves the warehouse; (3) DELETE
        /shipments/<shipmentId> to roll the shipment back. A Java client JAR is available for use with the group ID
        'com.liferay', artifact ID 'com.liferay.headless.commerce.admin.shipment.client', and version '1.0.41'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Liferay Commerce Admin Shipment API
    version: v1.0
openapi: 3.0.0
paths:
    /shipment-items/by-externalReferenceCode/{externalReferenceCode}:
        delete:
            description:
                Deletes the CommerceShipmentItem identified by external reference code. Resolves the row via
                CommerceShipmentItemService.fetchCommerceShipmentItemByExternalReferenceCode and calls
                deleteCommerceShipmentItem with restoreStockQuantity=false; raises NoSuchShipmentItemException (404)
                when the ERC is unknown.
            parameters:
                -   $ref: "#/components/parameters/externalReferenceCodePathParam"
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Authentication information is missing or invalid
                403:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The authenticated user lacks permission for the requested action on this shipment item.
            security:
                -   BasicAuth: []
                -   BearerAuth: []
                -   OAuth2:
                        -   CommerceOpenApiAdmin.write
            summary: Deletes a Shipment Item by external reference code.
            tags:
                -   ShipmentItem
        get:
            description:
                Returns the CommerceShipmentItem identified by external reference code. Resolves the row via
                CommerceShipmentItemService.fetchCommerceShipmentItemByExternalReferenceCode against the current
                company scope; raises NoSuchShipmentItemException (404) when the ERC is unknown.
            operationId: getShipmentByExternalReferenceCodeItem
            parameters:
                -   $ref: "#/components/parameters/externalReferenceCodePathParam"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ShipmentItem"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/ShipmentItem"
                    description:
                        Successful operation
                400:
                    description:
                        Invalid input
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Authentication information is missing or invalid
                403:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The authenticated user lacks permission for the requested action on this shipment item.
                404:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The specified resource was not found
                500:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Unexpected error
            security:
                -   BasicAuth: []
                -   BearerAuth: []
                -   OAuth2:
                        -   CommerceOpenApiAdmin.read
            summary: Gets a Shipment Item by external reference code.
            tags:
                -   ShipmentItem
        patch:
            description:
                Updates the CommerceShipmentItem identified by external reference code using JSON Merge Patch (only
                the supplied fields are modified). Resolves the row, then calls
                CommerceShipmentItemService.updateCommerceShipmentItem with the resolved warehouse, the new quantity,
                and the validateInventory flag (default true). Raises NoSuchShipmentItemException (404) when the ERC
                is unknown; domain validation (inactive warehouse, insufficient stock) maps to 422.
            parameters:
                -   $ref: "#/components/parameters/externalReferenceCodePathParam"
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ShipmentItem"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/ShipmentItem"
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ShipmentItem"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/ShipmentItem"
                    description:
                        Updated
                400:
                    description:
                        Invalid input
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Authentication information is missing or invalid
                403:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The authenticated user lacks permission for the requested action on this shipment item.
                404:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The specified resource was not found
                422:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        A domain validation error prevented the shipment item from being updated (for example, the
                        referenced warehouse is inactive, the requested quantity exceeds stock on hand, or a required
                        cross-reference cannot be resolved).
                500:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Unexpected error
            security:
                -   BasicAuth: []
                -   BearerAuth: []
                -   OAuth2:
                        -   CommerceOpenApiAdmin.write
            summary: Updates a Shipment Item by external reference code.
            tags:
                -   ShipmentItem
    /shipment-items/{shipmentItemId}:
        delete:
            description:
                Deletes the CommerceShipmentItem identified by shipmentItemId. Calls
                CommerceShipmentItemService.deleteCommerceShipmentItem with restoreStockQuantity=false; the row is
                removed without re-crediting the shipped quantity back to the order item.
            operationId: deleteShipmentItem
            parameters:
                -   $ref: "#/components/parameters/shipmentItemIdPathParam"
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
